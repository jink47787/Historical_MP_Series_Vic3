l_english:

 # HMPS Reserve Currency tiers in the tech tree (rc_weekly_update, common/scripted_effects/HMPS_specie_famine_effects.txt). Vanilla text first, unchanged
 mutual_funds_desc:1 "A sort of pooled investment funds, the mutual fund helps combine the individual wealth of investors into massive pools of money that can flex immense financial strength to acquire securities and other costly financial instruments.\n\n#bold [concept_reserve_currency]:#! only the top [concept_great_power] can hold it, and only once it has researched this. While we hold it: #P +15%#! wages, #P +250#! [concept_prestige], #P -1.5%#! loan interest and #P +15%#! [concept_trade_advantage], and we can't suffer a [concept_specie_famine]."
 international_exchange_standards_desc:1 "Establishing an international system of accounting and exchange makes trade between nations simpler and cheaper to maintain.\n\n#bold [concept_reserve_currency]:#! if we hold it, this doubles its effects: #P +30%#! wages, #P +500#! [concept_prestige], #P -3%#! loan interest and #P +30%#! [concept_trade_advantage] (from +15%, +250, -1.5% and +15%)."
