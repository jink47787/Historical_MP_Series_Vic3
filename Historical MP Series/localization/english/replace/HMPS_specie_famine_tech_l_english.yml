l_english:

 # HMPS Reserve Currency tiers in the tech tree (rc_monthly_update, common/scripted_effects/HMPS_specie_famine_effects.txt). Vanilla text first, unchanged
 mutual_funds_desc:1 "A sort of pooled investment funds, the mutual fund helps combine the individual wealth of investors into massive pools of money that can flex immense financial strength to acquire securities and other costly financial instruments.\n\n#bold [concept_reserve_currency]:#! if we hold it, this doubles its effects. Every country in our [concept_market]: #P +5%#! wages (from +2.5%). Us: #P +250#! [concept_prestige] and #P -2%#! loan interest (from +125 and -1%), and we can no longer suffer a [concept_specie_famine]."
 international_exchange_standards_desc:1 "Establishing an international system of accounting and exchange makes trade between nations simpler and cheaper to maintain.\n\n#bold [concept_reserve_currency]:#! if we hold it, this doubles its effects again. Every country in our [concept_market]: #P +10%#! wages (from +5%). Us: #P +500#! [concept_prestige] and #P -4%#! loan interest (from +250 and -2%)."
