l_english:

 # HMPS Reserve Currency tiers in the tech tree (rc_monthly_update, common/scripted_effects/HMPS_specie_famine_effects.txt). Vanilla text first, unchanged
 mutual_funds_desc:1 "A sort of pooled investment funds, the mutual fund helps combine the individual wealth of investors into massive pools of money that can flex immense financial strength to acquire securities and other costly financial instruments.\n\n#bold [concept_reserve_currency]:#! only a Great Power that has researched this can hold it. While we hold it, every country in our [concept_market]: #P +15%#! wages. Us: #P +250#! [concept_prestige], #P -2%#! loan interest and #P +20%#! [concept_trade_advantage], and we can't suffer a [concept_specie_famine]."
 international_exchange_standards_desc:1 "Establishing an international system of accounting and exchange makes trade between nations simpler and cheaper to maintain.\n\n#bold [concept_reserve_currency]:#! if we hold it, this doubles its effects. Every country in our [concept_market]: #P +30%#! wages (from +15%). Us: #P +500#! [concept_prestige], #P -4%#! loan interest and #P +40%#! [concept_trade_advantage] (from +250, -2% and +20%)."
