l_english:
 law_colonial_resettlement: "State-Sponsored Colonization"
 law_colonial_resettlement_desc: "The state organizes and funds the settlement of new lands, sending colonists and administrators from the country's incorporated states."
 institution_colonial_affairs_desc: "The office handling the management of foreign colonial holdings.\n\nEach investment level also strengthens the effects of the active [GetLawGroup('lawgroup_colonial_institutions').GetName] [concept_law] in [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. Ad Hoc Administration has no effects to strengthen."
 law_colonial_exploitation_desc: "Colonies are established to exploit the area for their natural resources and cheap labor.\n\nEach level of [GetInstitutionType('institution_colonial_affairs').GetName] gives all [Concept('concept_unincorporated_state','$concept_unincorporated_states$')] #P +4%#! plantation, rubber, logging and mining [concept_throughput], #P -6%#! [concept_turmoil] effects, #N +0.4%#! mortality per [concept_turmoil], #N -2%#! $bg_manufacturing$ [concept_throughput], #N -2%#! starting wages and #N -2%#! subsistence output.\n\nAt the maximum level (5): #P +20%#! plantation, rubber, logging and mining [concept_throughput], #P -30%#! [concept_turmoil] effects, #N +2%#! mortality per [concept_turmoil], #N -10%#! $bg_manufacturing$ [concept_throughput], #N -10%#! starting wages and #N -10%#! subsistence output."
 law_multicultural: "Open Citizenship"
 law_multicultural_desc: "Citizenship is open to every resident who pledges allegiance to the state and its laws, whatever their origin. Peoples in their homelands and those who share the nation's heritage are welcomed most readily, while culturally distant groups still face prejudice."
 from_multiculturalism: "Open Citizenship Law"
