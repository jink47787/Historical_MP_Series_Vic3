l_english:
 law_colonial_resettlement: "State-Sponsored Colonization"
 law_colonial_resettlement_desc: "The state organizes and funds the settlement of new lands, sending colonists and administrators from the country's incorporated states."
 institution_colonial_affairs_desc: "The office handling the management of foreign colonial holdings.\n\nEach investment level also strengthens the effects of the active [GetLawGroup('lawgroup_colonial_institutions').GetName] [concept_law] in [Concept('concept_unincorporated_state','$concept_unincorporated_states$')]. Ad Hoc Administration has no effects to strengthen."
 law_colonial_exploitation_desc: "Colonies are established to exploit the area for their natural resources and cheap labor.\n\nIn all [Concept('concept_unincorporated_state','$concept_unincorporated_states$')], per level of [GetInstitutionType('institution_colonial_affairs').GetName] (up to level 5):\n• #P +4%#! plantation, rubber, logging and mining [concept_throughput] (#P +20%#! at level 5)\n• #P -6%#! [concept_turmoil] effects (#P -30%#! at level 5)\n• #N +0.4%#! mortality per [concept_turmoil] (#N +2%#! at level 5)\n• #N -2%#! $bg_manufacturing$ [concept_throughput] (#N -10%#! at level 5)\n• #N -2%#! starting wages (#N -10%#! at level 5)\n• #N -2%#! subsistence output (#N -10%#! at level 5)"
 law_multicultural: "Multinationalism"
 law_multicultural_desc: "The state recognises several distinct nationalities as forming part of a common nation, granting citizenship rights without requiring a shared language or cultural identity. Foreign cultures are discriminated against unless they share heritage or customs with one of these nationalities."
 from_multiculturalism: "Multinationalism Law"
