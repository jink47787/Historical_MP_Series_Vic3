l_english:
 
 concept_literacy:0 "Education Level"
 concept_literate:0 "Educated"
 concept_literacy_desc:2 "The educational attainment level in a [concept_pop]. Certain [Concept('concept_profession', '$concept_professions$')] demand higher $concept_literacy$ than others, limiting the [concept_pop_qualifications] for $concept_pops$ in other $concept_professions$ unless their $concept_literacy$ is high enough. You can invest in your [SelectLocalization(GetPlayer.IsValid,'concept_literacy_desc_added','Education')] in order to develop higher $concept_literacy$ in your $concept_population$ over time."

 REPUDIATE_OBLIGATION_EFFECTS:0 "- Greatly reduced [concept_relations] with the [concept_country] whose [concept_obligation] we repudiated\n- Reduced [concept_relations] with all other countries we owe an [concept_obligation]\n- Reduced [concept_prestige] & [concept_influence], higher [concept_budget_interest] payments, and reduced [concept_infamy] decay for a period of #v 10#! years. During this period, other [Concept('concept_country','$concept_countries$')] will consider [Concept('concept_obligation', '$concept_obligations$')] from us to be of little value"
 
 DIPLOMATIC_ACCEPTANCE_WAR_ALLY:0 "Wartime Allies"
 
 POP_POLLUTED_STATE: "[Concept('concept_pop', '$concept_pops$')] living in [Concept('concept_state', '$concept_states$')] with high [concept_pollution_impact]"
 POP_LOW_SOL: "[Concept('concept_pop', '$concept_pops$')] living in [Concept('concept_state', '$concept_states$')] with high [concept_expected_sol]"
 
 concept_secondary_cultures:0 "Secondary Cultures"
 concept_secondary_culture:0 "Secondary Culture"
 concept_secondary_culture_desc:4 "A [concept_culture] or $concept_cultures$ a [Concept('concept_country','$concept_country_nation_state$')] is partially associated with, and accepts at one Tier Higher than otherwise."
 concept_secondary_cultures_desc:4 "A [concept_culture] or $concept_cultures$ a [Concept('concept_country','$concept_country_nation_state$')] is partially associated with, and accepts at one Tier Higher than otherwise."
 
 concept_stigmatised_cultures:0 "Stigmatised Cultures"
 concept_stigmatised_culture:0 "Stigmatised Culture"
 concept_stigmatised_culture_desc:4 "A [concept_culture] or $concept_cultures$ a [Concept('concept_country','$concept_country_nation_state$')] is especially discriminatory towards, and accepts at one Tier Lower than otherwise."
 concept_stigmatised_cultures_desc:4 "A [concept_culture] or $concept_cultures$ a [Concept('concept_country','$concept_country_nation_state$')] is especially discriminatory towards, and accepts at one Tier Lower than otherwise."

 concept_hmps_fx_topup:0 "World Top-up"
 concept_hmps_fx_topup_desc:0 "Trade only moves money between markets. Apart from mined gold, the world's total stays the same while trade keeps growing. When the world's reserves fall below 12 months of world imports, every market is topped up by the same number of months of its own imports. This stands in for silver, banknotes and credit, which the game doesn't track."
 concept_hmps_fx_bank_rate:0 "Bank Rate"
 concept_hmps_fx_bank_rate_desc:0 "The interest rate your market's central bank charges. The market owner sets it and every country in the market follows it. 4% is neutral. Raising it attracts foreign money and moves income into savings, but makes borrowing dearer and slows industry. Lowering it does the reverse. It can move up to two points at a time, then stays locked for 30 days."
 concept_hmps_fx_net_exports:0 "Net Exports"
 concept_hmps_fx_net_exports_desc:0 "What your market sold abroad minus what it bought abroad last week. Selling more than you buy brings foreign money in. Buying more than you sell spends it."
 concept_hmps_fx_gold_mined:0 "Gold Mined"
 concept_hmps_fx_gold_mined_desc:0 "Gold mined in your market last week, worth @money!100 per unit. Gold is accepted as money everywhere, so it adds straight to reserves. Mining and the [concept_hmps_fx_topup] are the only ways new money enters the world."
 concept_hmps_fx_capital_flow:0 "Capital Flow"
 concept_hmps_fx_capital_flow_desc:0 "Money investors moved into or out of your market last week. Investors move money to where it earns more interest: toward markets whose [concept_hmps_fx_bank_rate] is above the world reference rate, and away from those below it. Each point of difference moves 1% of your market's GDP a year, with no limit. The world reference rate is the average of all markets' rates, weighted by GDP, so whatever flows into one market flows out of others. The reserve-currency market's rate counts one point higher ([concept_hmps_fx_safe_haven]). Isolationist markets are left out: no money flows in or out of them. Money that comes in still belongs to foreigners. It adds to [concept_hmps_fx_foreign_held], and your market pays interest on it."
 concept_hmps_fx_interest:0 "Interest"
 concept_hmps_fx_interest_desc:0 "When foreigners keep money in your market, they expect interest on it, just as any saver does. While [concept_hmps_fx_foreign_held] is positive, your market pays them interest at your [concept_hmps_fx_bank_rate], out of your reserves. That money goes to the reserves of the markets that lent abroad, split by how much each one lent. If your market has lent abroad ([concept_hmps_fx_foreign_held] is negative), it receives a share instead."
 concept_hmps_fx_commission:0 "Invisibles"
 concept_hmps_fx_commission_desc:0 "Every other market pays 0.5% of its trade to the reserve-currency market, for the trade loans, insurance and banking its financiers provide. The more a market trades, the more it pays. When the role passes to a new market, the old one's share fades over 12 months while the new one's grows."
 concept_hmps_fx_safe_haven:0 "Safe Haven"
 concept_hmps_fx_safe_haven_desc:0 "Investors trust the reserve-currency market more than any other. In [concept_hmps_fx_capital_flow], its [concept_hmps_fx_bank_rate] counts as one point higher than it is, so it can draw foreign money without raising its rate. When the role passes to a new market, the old one's pull fades over 12 months while the new one's grows."
 concept_hmps_fx_pool_moved:0 "Investment Pool Moved"
 concept_hmps_fx_pool_moved_desc:0 "When money leaves a market, some of the investment it would have paid for leaves too. Countries in a market losing money give up half of the outflow from their investment pools, and countries in markets gaining money receive it. A country only pays if its pool can cover its whole share. This line doesn't change reserves."
 concept_hmps_fx_foreign_held:0 "Foreign Money Held"
 concept_hmps_fx_foreign_held_desc:0 "The total that foreigners have put into your market over time, not just last week. Positive: foreigners hold this much here, and your market pays them interest. Negative: your market has lent this much abroad and earns interest on it."
 concept_hmps_fx_import_bill:0 "Monthly Import Bill"
 concept_hmps_fx_import_bill_desc:0 "What your market spends on imports in a month at last week's pace. Reserves are counted in months of this bill, which is how long they would last if nothing came in. Small or closed markets use a minimum of 5% of GDP a year."
 concept_hmps_fx_price_level:0 "Price Level"
 concept_hmps_fx_price_level_desc:0 "How dear things are in your market compared with the rest of the world, from #v -4#! (deep deflation) to #v +4#! (high inflation). It heads toward a target with two parts. Money: reserves compared with GDP, against the world's; holding twice the world's share gives #v +4#!, holding none gives #v -4#!. [concept_hmps_fx_bank_rate]: half a step up for each point below 4%, half a step down for each point above. The level moves one step at a time, once the target has stayed at least one step away for 26 weeks.\n\nEach step of inflation: wages #v -2%#!, throughput #v +2%#!, export advantage #v -5%#!, import advantage #v +5%#!. Deflation is the reverse. A market with too much money buys more abroad and sells less, and one with too little does the opposite, until trade balances again."
