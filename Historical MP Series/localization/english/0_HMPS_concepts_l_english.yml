l_english:
 
 concept_literacy:0 "Education Level"
 concept_literate:0 "Educated"
 concept_literacy_desc:2 "The educational attainment level in a [concept_pop]. Certain [Concept('concept_profession', '$concept_professions$')] demand higher $concept_literacy$ than others, limiting the [concept_pop_qualifications] for $concept_pops$ in other $concept_professions$ unless their $concept_literacy$ is high enough. You can invest in your [SelectLocalization(GetPlayer.IsValid,'concept_literacy_desc_added','Education')] in order to develop higher $concept_literacy$ in your $concept_population$ over time."

 REPUDIATE_OBLIGATION_EFFECTS:0 "- Greatly reduced [concept_relations] with the [concept_country] whose [concept_obligation] we repudiated\n- Reduced [concept_relations] with all other countries we owe an [concept_obligation]\n- Reduced [concept_prestige] & [concept_influence], higher [concept_budget_interest] payments, and reduced [concept_infamy] decay for a period of #v 10#! years. During this period, other [Concept('concept_country','$concept_countries$')] will consider [Concept('concept_obligation', '$concept_obligations$')] from us to be of little value"
 
 DIPLOMATIC_ACCEPTANCE_WAR_ALLY:0 "Wartime Allies"
 
 POP_POLLUTED_STATE: "[Concept('concept_pop', '$concept_pops$')] living in [Concept('concept_state', '$concept_states$')] with high [concept_pollution_impact]"
 POP_LOW_SOL: "[Concept('concept_pop', '$concept_pops$')] living in [Concept('concept_state', '$concept_states$')] with high [concept_expected_sol]"
 
 concept_secondary_cultures:0 "Secondary Cultures"
 concept_secondary_culture:0 "Secondary Culture"
 concept_secondary_culture_desc:4 "A [concept_culture] or $concept_cultures$ a [Concept('concept_country','$concept_country_nation_state$')] is partially associated with, and accepts at one Tier Higher than otherwise."
 concept_secondary_cultures_desc:4 "A [concept_culture] or $concept_cultures$ a [Concept('concept_country','$concept_country_nation_state$')] is partially associated with, and accepts at one Tier Higher than otherwise."
 
 concept_stigmatised_cultures:0 "Stigmatised Cultures"
 concept_stigmatised_culture:0 "Stigmatised Culture"
 concept_stigmatised_culture_desc:4 "A [concept_culture] or $concept_cultures$ a [Concept('concept_country','$concept_country_nation_state$')] is especially discriminatory towards, and accepts at one Tier Lower than otherwise."
 concept_stigmatised_cultures_desc:4 "A [concept_culture] or $concept_cultures$ a [Concept('concept_country','$concept_country_nation_state$')] is especially discriminatory towards, and accepts at one Tier Lower than otherwise."

 concept_hmps_fx_topup:0 "World Top-up"
 concept_hmps_fx_topup_desc:0 "Trade only moves reserves between markets, so the world's total grows only from gold, while world imports keep growing. Each week, if the world's reserves fall below 12 months of world imports, every market gains the same number of months of its own imports to bring the world back to 12. It stands in for silver, credit and other money the game doesn't track."
 concept_hmps_fx_bank_rate:0 "Bank Rate"
 concept_hmps_fx_bank_rate_desc:0 "The interest rate set by a [concept_market]'s owner and followed by every country in that market. It runs from 2% to 10%, with 4% as the neutral rate that has no effects, and can move one point a month.\n\nA higher Bank Rate makes loans dearer, lowers [concept_building_wage], slows business and moves income into savings, while making the market's goods cheaper abroad. A lower Bank Rate does the opposite, except that it does not raise throughput or wages. All effects apply at once."
