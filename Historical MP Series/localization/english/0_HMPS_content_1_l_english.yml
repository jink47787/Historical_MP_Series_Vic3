 je_peru_bolivia_reason:1 "The Bolivian intervention into the Peruvian civil war of 1835 has led to the territories of Peru falling under the control of the [SCOPE.sCountry('bolivia_scope').GetRuler.GetPrimaryRoleTitle] of [SCOPE.sCountry('bolivia_scope').GetName]. [SCOPE.sCountry('bolivia_scope').GetNameNoFormatting] seeks to preserve this fragile Confederation, so that a true and complete union between her subjects might become possible.\n\n@information! The ambitions of the #bold Peru-Bolivian Confederation#! can be averted by forcing them to release their [Concept('concept_subject', '$concept_subjects$')] before the Progress Bar reaches #variable 100%#!.\n\n@warning! Whilst #b $BOL$#! seek to consolidate the #bold Confederation#!'s rule, she will be subject to increased aggression from her neighbors."
