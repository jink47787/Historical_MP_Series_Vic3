l_english:
  rule_HMPS_allow_truce_break:0 "HMPS: Truce Break"
  setting_HMPS_allow_truce_break:0 "Truce Break Allowed"
  setting_HMPS_allow_truce_break_desc:0 "Players will be able to spend Infamy to break Truces."
  setting_HMPS_disallow_truce_break:0 "Truce Break Disallowed"
  setting_HMPS_disallow_truce_break_desc:0 "Players will not be able to spend Infamy to break Truces."

  rule_HMPS_game_rule_auto_infamy_transfer:0 "HMPS: Automatic Subject Infamy Transfer"
  setting_HMPS_game_rule_auto_infamy_transfer_enabled:0 "Automatic Subject Infamy Transfer Enabled"
  setting_HMPS_game_rule_auto_infamy_transfer_enabled_desc:0 "Automatically transfers 50% of infamy gained by subjects to their overlord (done on a monthly tick). Will leave a modifier on the overlord country to show how much infamy has been transferred this way. This does not reduce the infamy of the subject."
  setting_HMPS_game_rule_auto_infamy_transfer_disabled:0 "Automatic Subject Infamy Transfer Disabled"
  setting_HMPS_game_rule_auto_infamy_transfer_disabled_desc:0 "Infamy will not be transferred from subjects to their overlord."
  
  rule_HMPS_game_rule_china_puppets:0 "HMPS: China Colonial Puppets"
  setting_HMPS_game_rule_china_puppets_enabled:0 "Automatic China Colonial Puppets Enabled"
  setting_HMPS_game_rule_china_puppets_enabled_desc:0 "Any integral Chinese state which is owned by a Non-Chinese nation will be given to a newly created colonial subject. Countries with Tibetan or Sinosphere primary cultures are exempt from this."
  setting_HMPS_game_rule_china_puppets_disabled:0 "Automatic China Colonial Puppets Disabled"
  setting_HMPS_game_rule_china_puppets_disabled_desc:0 "Anyone can take Chinese states."
  
  rule_HMPS_game_rule_india_puppets:0 "HMPS: India Colonial Puppets"
  setting_HMPS_game_rule_india_puppets_enabled:0 "Automatic India Colonial Puppets Enabled"
  setting_HMPS_game_rule_india_puppets_enabled_desc:0 "Any Indian state which is owned by a Non-Indian nation will be given to a newly created colonial subject."
  setting_HMPS_game_rule_india_puppets_disabled:0 "Automatic India Colonial Puppets Disabled"
  setting_HMPS_game_rule_india_puppets_disabled_desc:0 "Anyone can take Indian states."
  
  rule_HMPS_punish_major_non_leader_bloc_memebers:0"HMPS: Great and Major power Non-Leader Bloc Member Penalty"
  setting_HMPS_punish_major_non_leader_bloc_memebers:0"Non-Leader Bloc Member Penalties Enabled"
  setting_HMPS_punish_major_non_leader_bloc_memebers_desc:0"Great and Major Powers who are in a bloc which they are not the leader of will suffer a penalty. This Penalty is mild for Major Powers but very severe for Great Powers."
  setting_HMPS_punish_major_non_leader_bloc_memebers_disabled:0"Non-Leader Bloc Member Penalties Disabled"
  setting_HMPS_punish_major_non_leader_bloc_memebers_disabled_desc:0"No penalties are applied to Great and Major Power non-leader Power Bloc members."
  
  rule_HMPS_game_rule_GM_tool_fail_safe:0 "HMPS: Game Master Tool Fail-Safe"
  setting_HMPS_game_rule_GM_tool_fail_safe_enabled:0 "Game Master Tool Fail-Safe Enabled"
  setting_HMPS_game_rule_GM_tool_fail_safe_enabled_desc:0 "Allows the Rank 1 Great Power to always be able to take the decision to become Game Master. Useful as a fail-safe if the GM tool ever gets lost via a civil war or other means."
  setting_HMPS_game_rule_GM_tool_fail_safe_disabled:0 "Game Master Tool Fail-Safe Disabled"
  setting_HMPS_game_rule_GM_tool_fail_safe_disabled_desc:0 "Game Master decision functions as normal, only allowing for one player to use it before being unusable."
  
  rule_HMPS_game_rule_MECHANIC_revanchism:0 "HMPS: Revanchism"
  setting_HMPS_game_rule_MECHANIC_revanchism_enabled:0 "Revanchism Enabled (Recommended)"
  setting_HMPS_game_rule_MECHANIC_revanchism_enabled_desc:0 "Countries receive mild military buffs after losing core land based on the amount that was lost."
  setting_HMPS_game_rule_MECHANIC_revanchism_disabled:0 "Revanchism Disabled"
  setting_HMPS_game_rule_MECHANIC_revanchism_disabled_desc:0 "Revanchism is disabled."
  
  rule_HMPS_game_rule_MECHANIC_research_effort:0 "HMPS: Research Effort"
  setting_HMPS_game_rule_MECHANIC_research_effort_enabled:0 "Research Effort Enabled (Recommended)"
  setting_HMPS_game_rule_MECHANIC_research_effort_enabled_desc:0 "Innovation from universities will have diminishing returns and be marginally more efficient for larger countries. Works via the Research Effort mechanic."
  setting_HMPS_game_rule_MECHANIC_research_effort_disabled:0 "Research Effort Disabled"
  setting_HMPS_game_rule_MECHANIC_research_effort_disabled_desc:0 "Dynamic Research Effort is disabled (For technical reasons, Research Effort will still exist but will be converted to innovation at a constant rate of 10 to 1)."
  
  rule_HMPS_game_rule_MECHANIC_diseos:0 "HMPS: Diseconomies Of Scale"
  setting_HMPS_game_rule_MECHANIC_diseos_enabled:0 "Diseconomies Of Scale Enabled (Recommended)"
  setting_HMPS_game_rule_MECHANIC_diseos_enabled_desc:0 "States will receive a construction efficiency malus based on their urbanisation. Impact is reduced by technology."
  setting_HMPS_game_rule_MECHANIC_diseos_disabled:0 "Diseconomies Of Scale Disabled"
  setting_HMPS_game_rule_MECHANIC_diseos_disabled_desc:0 "Diseconomies Of Scale is Disabled."
  
  rule_HMPS_game_rule_MECHANIC_demographic_wfr:0 "HMPS: Workforce Demographics"
  setting_HMPS_game_rule_MECHANIC_demographic_wfr_enabled:0 "Workforce Demographics Enabled (Recommended)"
  setting_HMPS_game_rule_MECHANIC_demographic_wfr_enabled_desc:0 "Represents more developed demographic distributions having a higher proportion of working age adults by giving states above 15 SoL up to +5% Workforce Ratio."
  setting_HMPS_game_rule_MECHANIC_demographic_wfr_disabled:0 "Workforce Demographics Disabled"
  setting_HMPS_game_rule_MECHANIC_demographic_wfr_disabled_desc:0 "Workforce Demographics is disabled."
  
  rule_HMPS_game_rule_cultural_community_lock:0 "HMPS: Cultural Community Lock"
  setting_HMPS_game_rule_cultural_community_lock_enabled:0 "Cultural Community Lock Enabled (Recommended)"
  setting_HMPS_game_rule_cultural_community_lock_enabled_desc:0 "New cultural communities will be blocked from spawning in states without a homeland which they share a heritage group with unless they are accepted at at least Tier 3. Does not impact any pre-existing cultural communities. This will prevent things like Chinese in New York, Indians in London and Africans in Paris."
  setting_HMPS_game_rule_cultural_community_lock_disabled:0 "Cultural Community Lock Disabled"
  setting_HMPS_game_rule_cultural_community_lock_disabled_desc:0 "Cultural communities will not be locked by heritage trait group."
  
  rule_HMPS_game_rule_africa_acceptance_nerf:0 "HMPS: African Racism"
  setting_HMPS_game_rule_africa_acceptance_nerf_enabled:0 "African Racism Enabled"
  setting_HMPS_game_rule_africa_acceptance_nerf_enabled_desc:0 "African countries now have a penalty to acceptance for African cultures with different heritage traits."
  setting_HMPS_game_rule_africa_acceptance_nerf_disabled:0 "African Racism Disabled"
  setting_HMPS_game_rule_africa_acceptance_nerf_disabled_desc:0 "African acceptance works as normal."
  
  rule_HMPS_game_rule_southeast_asia_acceptance_nerf:0 "HMPS: Southeast Asian Racism"
  setting_HMPS_game_rule_southeast_asia_acceptance_nerf_enabled:0 "Southeast Asian Racism Enabled"
  setting_HMPS_game_rule_southeast_asia_acceptance_nerf_enabled_desc:0 "Southeast Asian countries now have a penalty to acceptance for Southeast Asian cultures with different heritage traits."
  setting_HMPS_game_rule_southeast_asia_acceptance_nerf_disabled:0 "Southeast Asian Racism Disabled"
  setting_HMPS_game_rule_southeast_asia_acceptance_nerf_disabled_desc:0 "Southeast Asian acceptance works as normal."
  
  rule_HMPS_game_rule_decentralized_africa:0 "HMPS: Decentralized Africa"
  setting_HMPS_game_rule_decentralized_africa_enabled:0 "Decentralized Africa Enabled (Recommended)"
  setting_HMPS_game_rule_decentralized_africa_enabled_desc:0 "Unrecognised African AI countries will become decentralized after lobby. Some exceptions may apply. Any country which has been selected by a player in the lobby will be unaffected."
  setting_HMPS_game_rule_decentralized_africa_disabled:0 "Decentralized Africa Disabled"
  setting_HMPS_game_rule_decentralized_africa_disabled_desc:0 "Africa will remain as vanilla."
  
  rule_HMPS_game_rule_allow_players_to_rename_states:0 "HMPS: Allow Player State Renaming"
  setting_HMPS_game_rule_allow_players_to_rename_states_enabled:0 "State Renaming Enabled"
  setting_HMPS_game_rule_allow_players_to_rename_states_enabled_desc:0 "Players are able to rename states they own."
  setting_HMPS_game_rule_allow_players_to_rename_states_disabled:0 "State Renaming Disabled"
  setting_HMPS_game_rule_allow_players_to_rename_states_disabled_desc:0 "Players cannot rename states."

  rule_HMPS_game_rule_goods_transfer:0 "HMPS: Goods Transfer Treaties"
  setting_HMPS_game_rule_goods_transfer_enabled:0 "Goods Transfers Allowed"
  setting_HMPS_game_rule_goods_transfer_enabled_desc:0 "Countries can propose Goods Transfer articles in treaties as normal."
  setting_HMPS_game_rule_goods_transfer_disabled:0 "Goods Transfers Disallowed"
  setting_HMPS_game_rule_goods_transfer_disabled_desc:0 "No country, player or AI, can propose new Goods Transfer articles. Goods Transfers that already exist, including those at game start, will continue until they end."
  HMPS_goods_transfer_disabled_by_game_rule_tt:0 "Goods Transfers are disabled by game rule"