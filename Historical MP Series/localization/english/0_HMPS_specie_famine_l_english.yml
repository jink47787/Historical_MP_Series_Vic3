l_english:

 # HMPS Specie Famine, Inflationary Period and Reserve Currency (common/journal_entries/HMPS_Specie_Famine.txt).
 # Figures read GetPlayer: these journal entries, buttons and events are only ever shown to their own country

 ### Concepts
 concept_specie_famine:0 "Specie Famine"
 concept_specie_famine_desc:0 "A [concept_specie_famine] is a run on a [concept_market]’s foreign reserves: the gold and silver that pay for its imports. It can strike a player who leads a [concept_market] while that [concept_market] runs a [concept_balance_of_trade] deficit of at least #v 4%#! of [concept_gdp]. The monthly chance grows with the deficit, from #v 1 in 120#! at 4% to #v 1 in 6#! at 12% or more, and is #N ten times#! higher for #v 2 months#! after another [concept_market]’s famine ends in collapse. A [concept_market] can only suffer one at a time, and not within #v 5 years#! of the last.\n\nThe reserves start at #v 10 weeks#! of the [concept_market]’s imports, and every week the [concept_market]’s [concept_balance_of_trade] drains or refills them. Every country in the [concept_market] shares the crisis and its modifiers, but only the leader can act: raise the Bank Rate, pay from the treasury, or, in a war that has cost it 100,000 casualties, suspend convertibility.\n\n#bold Passes#! with #v 26 weeks#! of imports in reserve, or #v 26 weeks#! of surplus in a row, with specie payments in force. There is no reward.\n#bold Fails#! if the reserves run out: trade halts, imports collapse, the upper and middle strata radicalize and credit stays dear for #v 30 months#!, across the whole [concept_market]. A leader that joins another [concept_market] also fails, but suffers alone.\n\nOnce the holder of the [concept_reserve_currency] has researched #v Mutual Funds#!, it can no longer suffer one."
 concept_reserve_currency:0 "Reserve Currency"
 concept_reserve_currency_desc:0 "The [concept_reserve_currency] is the money the world keeps its reserves in. Only one country holds it at a time.\n\n$RC_RULES$[AddLocalizationIf(GetPlayer.IsValid,'concept_reserve_currency_desc_added')]"
 concept_reserve_currency_desc_added:0 "[AddLocalizationIf(GetGlobalVariable('reserve_currency_holder').IsSet,'RC_CURRENT_HOLDER_LINE')]"

 RC_RULES:0 "$RC_TIER_EFFECTS$\n\n#bold Taking it:#! a Great Power that leads its own [concept_market] and runs a [concept_balance_of_trade] deficit takes over once, for #v 6 months#! in a row, its [concept_market] has imported more than the holder’s.\n#bold Losing it:#! the holder loses it after #v 6 months#! in a row without a deficit. It then stays vacant until one such Great Power has led the others in imports for #v 6 months#! in a row. If the holder is annexed, stops being a Great Power, defaults on its loans or stops leading its own [concept_market], the top importer among such Great Powers takes over at once. A holder that defaulted can’t win it back for #v 5 years#!."
 RC_CURRENT_HOLDER_LINE:0 "\n\nHeld by: #v [GetGlobalVariable('reserve_currency_holder').GetCountry.GetName]#!"

 ### Reserve Currency: tiers and challengers (no scope needed; rc_tier reads the holder)
 RC_TIER_EFFECTS:0 "[AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('rc_tier'),'(CFixedPoint)1.5'),'RC_TIER_1_EFFECTS')][AddLocalizationIf(And(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('rc_tier'),'(CFixedPoint)1.5'),LessThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('rc_tier'),'(CFixedPoint)2.5')),'RC_TIER_2_EFFECTS')][AddLocalizationIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('rc_tier'),'(CFixedPoint)2.5'),'RC_TIER_3_EFFECTS')]"
 RC_TIER_1_EFFECTS:0 "#bold Every country in the holder’s [concept_market]:#!\n• #P +2.5%#! wages\n#bold The holder:#!\n• #P +125#! [concept_prestige]\n• #P -1%#! loan interest\n• #P +25%#! [concept_trade_advantage]"
 RC_TIER_2_EFFECTS:0 "#bold Every country in the holder’s [concept_market]:#!\n• #P +5%#! wages\n#bold The holder:#!\n• #P +250#! [concept_prestige]\n• #P -2%#! loan interest\n• #P +25%#! [concept_trade_advantage]\n• immune to [concept_specie_famine]"
 RC_TIER_3_EFFECTS:0 "#bold Every country in the holder’s [concept_market]:#!\n• #P +10%#! wages\n#bold The holder:#!\n• #P +500#! [concept_prestige]\n• #P -4%#! loan interest\n• #P +25%#! [concept_trade_advantage]\n• immune to [concept_specie_famine]"
 RC_CHALLENGER:0 "[AddLocalizationIf(GetGlobalVariable('rc_top_challenger').IsSet,'RC_CHALLENGER_LINE')][AddLocalizationIf(Not(GetGlobalVariable('rc_top_challenger').IsSet),'RC_NO_CHALLENGER_LINE')]"
 RC_CHALLENGER_LINE:0 "Challenger: #v [GetGlobalVariable('rc_top_challenger').GetCountry.GetName]#! imports more than the holder and takes it in [GetVarTimeRemaining( GetGlobalVariable('rc_top_challenger').GetCountry.MakeScope, 'rc_takeover_days' )|v] day(s)"
 RC_NO_CHALLENGER_LINE:0 "No Great Power with a deficit imports more than the holder."
 RC_HOLDER_SURPLUS_LINE:0 "\n#N No deficit:#! the holder loses it in [GetVarTimeRemaining( GetGlobalVariable('reserve_currency_holder').GetCountry.MakeScope, 'rc_surplus_days' )|v] day(s) unless its deficit returns"
 RC_VACANT_CANDIDATE:0 "[AddLocalizationIf(GetGlobalVariable('rc_vacant_candidate').IsSet,'RC_VACANT_CANDIDATE_LINE')][AddLocalizationIf(Not(GetGlobalVariable('rc_vacant_candidate').IsSet),'RC_NO_VACANT_CANDIDATE_LINE')]"
 RC_VACANT_CANDIDATE_LINE:0 "Candidate: #v [GetGlobalVariable('rc_vacant_candidate').GetCountry.GetName]#! leads in imports and takes it in [GetVarTimeRemaining( GetGlobalVariable('rc_vacant_candidate').GetCountry.MakeScope, 'rc_takeover_days' )|v] day(s)"
 RC_NO_VACANT_CANDIDATE_LINE:0 "No Great Power runs a deficit, so none can take it."

 ### Reserve Currency: top importers, ranked monthly by rc_rank_top_importers and listed by rc_top_importers_sgui (THIS = each market's leader)
 RC_TOP_IMPORTERS:0 "Our [concept_market] imports @money![GetPlayer.GetMarket.GetOwner.MakeScope.ScriptValue('rc_market_imports')|D] a week.\n#bold Top importers#! (the holder and Great Powers with a deficit, ranked monthly):\n[GetScriptedGui('rc_top_importers_sgui').ExecuteTooltip(GuiScope.SetRoot(GetPlayer.MakeScope).End)]"
 RC_IMPORTER_HOLDER:0 "#v [THIS.GetCountry.GetName]#!: @money![THIS.GetCountry.MakeScope.ScriptValue('rc_market_imports')|D] a week (holder)"
 RC_IMPORTER_CHALLENGER:0 "#v [THIS.GetCountry.GetName]#!: @money![THIS.GetCountry.MakeScope.ScriptValue('rc_market_imports')|D] a week, takes it from the holder in [GetVarTimeRemaining( THIS.GetCountry.MakeScope, 'rc_takeover_days' )|v] day(s)"
 RC_IMPORTER:0 "#v [THIS.GetCountry.GetName]#!: @money![THIS.GetCountry.MakeScope.ScriptValue('rc_market_imports')|D] a week"
 RC_IMPORTERS_EMPTY:0 "None"

 ### Market panel, trade tab (gui/00_trade_partners_market_panel.gui)
 HMPS_RC_MARKET_PANEL:0 "[concept_reserve_currency]: #v [GetGlobalVariable('reserve_currency_holder').GetCountry.GetName]#![AddLocalizationIf(ObjectsEqual(GetGlobalVariable('reserve_currency_holder').GetCountry.Self,GetPlayer.Self),'RC_YOU')]"
 RC_YOU:0 " (you)"
 HMPS_RC_MARKET_PANEL_TT:0 "#header [concept_reserve_currency]#!\nHeld by #v [GetGlobalVariable('reserve_currency_holder').GetCountry.GetName]#!, whose [concept_market] imports @money![GetGlobalVariable('reserve_currency_holder').GetCountry.MakeScope.ScriptValue('rc_market_imports')|D] a week.[AddLocalizationIf(GetGlobalVariable('reserve_currency_holder').GetCountry.MakeScope.Var('rc_surplus_months').IsSet,'RC_HOLDER_SURPLUS_LINE')]\n$RC_CHALLENGER$\n$HMPS_LONG_DELIMITER$\n$RC_TOP_IMPORTERS$\n$HMPS_LONG_DELIMITER$\n$RC_RULES$"
 HMPS_RC_MARKET_PANEL_VACANT:0 "[concept_reserve_currency]: #v vacant#!"
 HMPS_RC_MARKET_PANEL_VACANT_TT:0 "#header [concept_reserve_currency]#!\nNo country holds it.\n$RC_VACANT_CANDIDATE$\n$HMPS_LONG_DELIMITER$\n$RC_TOP_IMPORTERS$\n$HMPS_LONG_DELIMITER$\n$RC_RULES$"

 # Balance of Trade warning, read from the shown market's owner
 HMPS_SF_RISK:0 "#N Specie Famine Possible!#!"
 HMPS_SF_RISK_TT:0 "#header [concept_specie_famine]#!\nThis [concept_market] runs a [concept_balance_of_trade] deficit of at least #v 4%#! of [concept_gdp], so a player-led [concept_market] risks a [concept_specie_famine]. The greater your deficit, the more the risk. The holder of the [concept_reserve_currency] is immune once it has researched #v Mutual Funds#!."
 HMPS_IP_RISK:0 "#yellow Inflationary Period Possible#!"
 HMPS_IP_RISK_TT:0 "#header Inflationary Period#!\nThis [concept_market] runs a [concept_balance_of_trade] surplus of at least #v 4%#! of [concept_gdp], so its leader risks an Inflationary Period, at most once every #v 6 months#! and never during a [concept_specie_famine]. The greater your surplus, the more the risk."


 ### Specie Famine: figures (GetPlayer is the leader or a member; the values read the leader's reserves for both)
 # The outliner shows two lines of the status, about 40 characters each, so every status is two short lines.
 # Balance of trade, surplus weeks and Bank Rate raises are in the bar tooltip, the completion conditions and the buttons
 SF_RESERVES:0 "Reserves: #v [GetPlayer.MakeScope.ScriptValue('sf_reserve_weeks')|1]#!/26 weeks (@money![GetPlayer.MakeScope.ScriptValue('sf_reserves_money')|D])"
 SF_FIGURES:0 "$SF_RESERVES$\n$SF_CHANGE$"
 SF_CHANGE:0 "[AddLocalizationIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('sf_is_suspended'),'(CFixedPoint)0'),'SF_CHANGE_FROZEN')][AddLocalizationIf(LessThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('sf_weekly_change_weeks'),'(CFixedPoint)0'),'SF_CHANGE_FALLING')][AddLocalizationIf(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('sf_weekly_change_weeks'),'(CFixedPoint)0'),'SF_CHANGE_RISING')][AddLocalizationIf(And(Not(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('sf_is_suspended'),'(CFixedPoint)0')),And(Not(LessThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('sf_weekly_change_weeks'),'(CFixedPoint)0')),Not(GreaterThan_CFixedPoint(GetPlayer.MakeScope.ScriptValue('sf_weekly_change_weeks'),'(CFixedPoint)0')))),'SF_CHANGE_STEADY')]"
 SF_CHANGE_FALLING:0 "#N [GetPlayer.MakeScope.ScriptValue('sf_weekly_change_weeks')|2]#! a week, empty in #N [GetPlayer.MakeScope.ScriptValue('sf_weeks_to_empty')|0]#! weeks"
 SF_CHANGE_RISING:0 "#P +[GetPlayer.MakeScope.ScriptValue('sf_weekly_change_weeks')|2]#! a week, safe in #P [GetPlayer.MakeScope.ScriptValue('sf_weeks_to_target')|0]#! weeks"
 SF_CHANGE_FROZEN:0 "#v Frozen#!: convertibility suspended"
 SF_CHANGE_STEADY:0 "No change"
 SF_RULES:0 "Paper money was only as good as the promise to redeem it in gold or silver, and a nation that bought more abroad than it sold paid the difference in coin. When the coin ran short, banks raised their rates, merchants called in their loans and crowds queued to turn notes into specie. To fix this imbalance, a proper balance of trade must be restored. During wartime, governments can suspend convertibility, but the public will demand its renewal upon the war's end."

 ### Specie Famine: market leader journal entry
 je_specie_famine:0 "Specie Famine"
 je_specie_famine_reason:0 "Our [concept_market] buys far more abroad than it sells, and the gold and silver that settle the difference are leaving the country. If the foreign reserves run dry, the currency collapses, and every country in our [concept_market] goes down with it. They share in the crisis, but only we can act.\n$HMPS_LONG_DELIMITER$\n$SF_RULES$"
 je_specie_famine_status:0 "$SF_FIGURES$"
 je_specie_famine_status_surplus:0 "$SF_RESERVES$\n[GetPlayer.MakeScope.ScriptValue('sf_weekly_change_weeks')|+2] a week, surplus #v [GetPlayer.MakeScope.ScriptValue('sf_surplus_weeks')|0]#!/26 weeks"
 je_specie_famine_status_suspended:0 "$SF_RESERVES$\nSuspended #v [GetPlayer.MakeScope.Var('sf_suspension_weeks').GetValue|0]#!/208 weeks (#v [GetPlayer.MakeScope.Var('sf_peace_weeks').GetValue|0]#!/26 at peace)"
 je_specie_famine_resumed_tt:0 "Specie payments are in force"
 je_specie_famine_target_tt:0 "The foreign reserves reach #v 26 weeks#! of imports (now #v [GetPlayer.MakeScope.ScriptValue('sf_reserve_weeks')|1]#!)"
 je_specie_famine_surplus_tt:0 "Our [concept_market] has run a trade surplus for #v 26 weeks#! in a row (now #v [GetPlayer.MakeScope.ScriptValue('sf_surplus_weeks')|0]#!)"
 je_specie_famine_complete_tt:0 "The [concept_specie_famine] ends. There is no reward: we have only avoided a disaster."
 je_specie_famine_empty_tt:0 "The foreign reserves run out"
 je_specie_famine_left_market_tt:0 "We join another [concept_market]"
 je_specie_famine_fail_market_tt:0 "Every other country in our [concept_market] suffers the same collapse, except the loss of [concept_prestige]"
 sf_tariff_reset_tt:0 "All [concept_tariffs] and subventions are reset to none"
 je_specie_famine_contagion_tt:0"For #v 2 months#!, every other [concept_market] is #N ten times#! as likely to suffer a [concept_specie_famine]"

 ### Specie Famine: member journal entry
 je_specie_famine_member:0 "Specie Famine"
 je_specie_famine_member_reason:0 "Our [concept_market] buys far more abroad than it sells, and [GetPlayer.GetMarket.GetOwner.GetName]’s foreign reserves are paying for it. We share in the crisis and in whatever measures [GetPlayer.GetMarket.GetOwner.GetName] takes, but only they can act. If the reserves run dry, we fall with them. Leaving the [concept_market] frees us from it.\n$HMPS_LONG_DELIMITER$\n$SF_RULES$"
 je_specie_famine_member_status:0 "$SF_FIGURES$"
 je_specie_famine_member_status_suspended:0 "$SF_RESERVES$\n#v Convertibility suspended#!"
 je_specie_famine_member_complete_tt:0 "Our [concept_market] leader’s [concept_specie_famine] passes"
 je_specie_famine_member_fail_tt:0 "Our [concept_market] leader’s foreign reserves run out while we are in its [concept_market]"

 ### Specie Famine: progress bar. Left: the reserves. Right: this week's change and the estimate. Tooltip line: this week's balance of trade
 sf_reserves_bar:0 "Foreign Reserves"
 sf_reserves_bar_desc:0 "Reserves: #v [GetPlayer.MakeScope.ScriptValue('sf_reserve_weeks')|1]#!/26 weeks"
 sf_reserves_bar_second_desc:0 "$SF_CHANGE$"
 sf_reserves_bar_trade_balance:0 "[concept_balance_of_trade] this week: @money![GetPlayer.MakeScope.ScriptValue('sf_weekly_change_money')|D+] ([GetPlayer.MakeScope.ScriptValue('sf_market_bop_share')|+%1] of [concept_gdp])"

 ### Specie Famine: buttons (market leader only)
 sf_raise_bank_rate_button:0 "Raise the Bank Rate"
 sf_raise_bank_rate_button_desc:0 "By raising the discount rate, the bank chokes domestic credit and lowers prices, making exports more competitive and hampering imports. Each raise lasts until the crisis ends, then fades over #v 2 years#!, and the rate can be raised #v 3#! times (#v [GetPlayer.MakeScope.ScriptValue('sf_bank_rate_stacks')|0]#!/3 so far)."
 sf_raise_bank_rate_max_tt:0 "The Bank Rate has been raised fewer than #v 3#! times"
 sf_bank_rate_market_tt:0 "Every other country in our [concept_market] gains the same raise until the crisis ends, then it fades over #v 2 years#!."
 sf_bank_rate_market_command_tt:0 "$sf_bank_rate_market_tt$ Under #v Command Economy#!, #N +4%#! tax waste replaces the investment efficiency penalty."
 sf_pay_from_treasury_button:0 "Pay from the Treasury"
 sf_pay_from_treasury_button_desc:0 "Ship gold from the treasury, borrowing it if we must, to shore up the foreign reserves. It costs #v 7.5%#! of our [concept_gdp], and only #v 5%#! of [concept_gdp] reaches the reserves. Once a month."
 sf_pay_from_treasury_cooldown_tt:0 "Has not paid from the treasury in the last month"
 sf_pay_from_treasury_funds_tt:0 "Gold reserves and unused credit cover the payment of @money![GetPlayer.MakeScope.ScriptValue('sf_treasury_payment')|D] (available: @money![GetPlayer.MakeScope.ScriptValue('sf_available_funds')|D])"
 sf_pay_from_treasury_reserves_tt:0 "Foreign reserves: #P +@money![GetPlayer.MakeScope.ScriptValue('sf_treasury_reserve_gain')|D]#! (#P +[GetPlayer.MakeScope.ScriptValue('sf_treasury_reserve_gain_weeks')|1]#! weeks of imports)"
 sf_suspend_convertibility_button:0 "Suspend Convertibility"
 sf_suspend_convertibility_button_desc:0 "Stop paying out gold for our notes. The reserves stop falling, but the government’s word is worth less, wages fall across the [concept_market], and the crisis can’t pass until specie payments resume. Only in a war that has cost us #v 100,000#! casualties, and once per crisis."
 sf_suspend_once_tt:0 "Convertibility has not been suspended in this crisis"
 sf_suspend_war_tt:0 "We have suffered at least #v 100,000#! casualties in one of our current wars"
 sf_suspension_members_tt:0 "Every other country in our [concept_market]: #N -10%#! wages until payments resume"
 sf_suspension_frozen_tt:0 "The foreign reserves are frozen, and weeks of surplus stop counting, until specie payments resume. Payments resume by themselves after #v 208 weeks#!, or after #v 26 weeks#! of peace"
 sf_resume_specie_payments_button:0 "Resume Specie Payments"
 sf_resume_specie_payments_button_desc:0 "Honour our notes in gold again. Buying back the specie costs money every week for #v 12 months#!, but the crisis can’t pass without it. Otherwise payments resume by themselves after #v 208 weeks#!, or #v 26 weeks#! of peace."
 sf_resumption_members_tt:0 "Every other country in our [concept_market] loses the suspension’s wage cut, and the [concept_balance_of_trade] moves the foreign reserves again"

 ### Inflationary Period
 ip_market_wide_tt:0 "Every other country in our [concept_market] gains the same modifier for #v 24 months#!"

 ### Modifiers
 sf_tight_credit:0 "Tight Credit"
 sf_tight_credit_desc:0 "A [concept_specie_famine] is draining the [concept_market]’s foreign reserves. Lenders are wary and traders hoard specie."
 sf_bank_rate_1:0 "Raised Bank Rate"
 sf_bank_rate_1_desc:0 "$SF_BANK_RATE_DESC$"
 sf_bank_rate_2:0 "Raised Bank Rate (Second Raise)"
 sf_bank_rate_2_desc:0 "$SF_BANK_RATE_DESC$"
 sf_bank_rate_3:0 "Raised Bank Rate (Third Raise)"
 sf_bank_rate_3_desc:0 "$SF_BANK_RATE_DESC$"
 sf_bank_rate_command_1:0 "Raised Bank Rate"
 sf_bank_rate_command_1_desc:0 "$SF_BANK_RATE_DESC$"
 sf_bank_rate_command_2:0 "Raised Bank Rate (Second Raise)"
 sf_bank_rate_command_2_desc:0 "$SF_BANK_RATE_DESC$"
 sf_bank_rate_command_3:0 "Raised Bank Rate (Third Raise)"
 sf_bank_rate_command_3_desc:0 "$SF_BANK_RATE_DESC$"
 SF_BANK_RATE_DESC:0 "The bank has raised the discount rate to defend the foreign reserves, choking domestic credit and lowering prices. Lasts until the [concept_specie_famine] ends, then fades over #v 2 years#!."
 sf_bank_rate_aftermath:0 "Easing Bank Rate"
 sf_bank_rate_aftermath_desc:0 "$SF_BANK_RATE_AFTERMATH_DESC$"
 sf_bank_rate_aftermath_command:0 "Easing Bank Rate"
 sf_bank_rate_aftermath_command_desc:0 "$SF_BANK_RATE_AFTERMATH_DESC$"
 SF_BANK_RATE_AFTERMATH_DESC:0 "The [concept_specie_famine] is over, but the bank brings the discount rate down slowly and credit stays tight. Fades over #v 2 years#!, stronger for each time the rate was raised."
 sf_suspension_leader:0 "Convertibility Suspended"
 sf_suspension_leader_desc:0 "We no longer pay out gold for our notes. The reserves are safe, but our word is worth less. Lasts until specie payments resume."
 sf_suspension_member:0 "Convertibility Suspended"
 sf_suspension_member_desc:0 "Our [concept_market] leader no longer pays out gold for its notes. Lasts until specie payments resume."
 sf_resumption_payments:0 "Resumption of Specie Payments"
 sf_resumption_payments_desc:0 "Buying back the gold to honour our notes again."
 sf_trade_collapse:0 "Trade Collapse"
 sf_trade_collapse_desc:0 "With the currency in collapse, nobody will take our money abroad."
 sf_import_collapse:0 "Import Collapse"
 sf_import_collapse_desc:0 "Foreign sellers demand gold we no longer have."
 sf_credit_collapse:0 "Credit Collapse"
 sf_credit_collapse_desc:0 "The collapse of the currency has ruined the [concept_market]’s credit for years to come."
 sf_credit_collapse_command:0 "Credit Collapse"
 sf_credit_collapse_command_desc:0 "The collapse of the currency has ruined the [concept_market]’s credit for years to come."
 sf_credit_collapse_prestige:0 "Currency Disgraced"
 sf_credit_collapse_prestige_desc:0 "The world watched our currency collapse."
 ip_inflation_allowed:0 "Inflation Allowed"
 ip_inflation_allowed_desc:0 "Gold flowing in from abroad swells the money supply. Business booms while prices outrun wages."
 ip_money_supply_constricted:0 "Money Supply Constricted"
 ip_money_supply_constricted_desc:0 "The money supply is deliberately held back, deleveraging the economy. Foreign goods grow cheap and ours grow dear."
 rc_market_1:0 "Reserve Currency Market"
 rc_market_1_desc:0 "$RC_MARKET_DESC$"
 rc_market_2:0 "Reserve Currency Market (Mutual Funds)"
 rc_market_2_desc:0 "$RC_MARKET_DESC$"
 rc_market_3:0 "Reserve Currency Market (International Exchange Standards)"
 rc_market_3_desc:0 "$RC_MARKET_DESC$"
 RC_MARKET_DESC:0 "Our [concept_market] trades in the world’s [concept_reserve_currency]. It doubles when the holder researches Mutual Funds, and again with International Exchange Standards."
 rc_holder_1:0 "Reserve Currency"
 rc_holder_1_desc:0 "$RC_HOLDER_DESC$"
 rc_holder_2:0 "Reserve Currency (Mutual Funds)"
 rc_holder_2_desc:0 "$RC_HOLDER_DESC$"
 rc_holder_3:0 "Reserve Currency (International Exchange Standards)"
 rc_holder_3_desc:0 "$RC_HOLDER_DESC$"
 RC_HOLDER_DESC:0 "Bankers, merchants and governments the world over keep their reserves in our money, the [concept_reserve_currency], and settle their trade in it. Our credit is cheap and our name carries weight, and our strong money gives our merchants a trade advantage. Rivals may try to take this from us. Our prestige and cheaper credit double when we research Mutual Funds, and again with International Exchange Standards."

 ### Events: Specie Famine
 specie_famine.1.t:0 "A Famine of Specie"
 specie_famine.1.d:0 "The bullion is leaving. Week after week our [concept_market] buys more abroad than it sells, and the difference is settled in gold and silver shipped out of the vaults. The bankers’ ledgers put our foreign reserves at #v 10 weeks#! of imports, and falling. If they run dry, the currency will collapse, and every country in our [concept_market] with it."
 specie_famine.1.f:0 "“The drain is no longer a trickle,” the Governor of the Bank told the Cabinet. “It is a tide, and the tide does not care whose fault it is.”"
 specie_famine.1.a:0 "Defend the currency!"
 specie_famine.1.a.tt:0 "A [concept_specie_famine] begins. Every country in our [concept_market] shares it, but only we can act. The foreign reserves start at #v [GetPlayer.MakeScope.ScriptValue('sf_reserve_weeks')|1]#! weeks of imports (@money![GetPlayer.MakeScope.ScriptValue('sf_reserves_money')|D])."
 specie_famine.2.t:0 "Gold Flees the Market"
 specie_famine.2.d:0 "Our [concept_market] buys far more abroad than it sells, and [GetPlayer.GetMarket.GetOwner.GetName] is paying for the difference out of its foreign reserves. Now the reserves are running low. We will share the tight credit, and whatever measures [GetPlayer.GetMarket.GetOwner.GetName] takes to defend them. If they run dry, we will fall with them."
 specie_famine.2.f:0 "In the counting houses, clerks have begun to ask for payment in gold."
 specie_famine.2.a:0 "We can only watch."
 specie_famine.2.a.tt:0 "We share the [concept_specie_famine] of [GetPlayer.GetMarket.GetOwner.GetName]. Only they can act; leaving the [concept_market] frees us from it."
 specie_famine.3.t:0 "The Currency Collapses"
 specie_famine.3.d:0 "The last of the reserves are gone. Our notes are refused abroad, foreign sellers will not ship without gold, and the banks have shut their doors to all but their oldest friends. The ruin spreads through every country in our [concept_market]. It will be years before anyone lends to us on fair terms again."
 specie_famine.3.d_left_market:0 "By joining another [concept_market] we have abandoned our currency to its fate. The run on our reserves has become a rout, and we bear the collapse alone: our former [concept_market] partners are spared."
 specie_famine.3.f:0 "“Gentlemen, there is no more gold.”"
 specie_famine.3.a:0 "A black day."
 specie_famine.4.t:0 "Collapse in the Market"
 specie_famine.4.d:0 "[GetPlayer.GetMarket.GetOwner.GetName]’s foreign reserves have run dry, and its currency has collapsed. As a member of its [concept_market], we are dragged down with it: our trade has halted, imports have collapsed, and credit will be dear for years."
 specie_famine.4.f:0 "Our merchants hold bundles of notes that nobody will take."
 specie_famine.4.a:0 "We are dragged down with them."
 specie_famine.5.t:0 "The Drain Is Stanched"
 specie_famine.5.d:0 "The gold has stopped leaving. Our foreign reserves have recovered, and the panic in the counting houses has passed. Nobody is celebrating: we have only avoided a disaster, and we may not be so lucky next time."
 specie_famine.5.d_member:0 "[GetPlayer.GetMarket.GetOwner.GetName]’s foreign reserves have recovered, and the crisis has passed for our [concept_market]."
 specie_famine.5.f:0 "The Bank’s vaults are no longer echoing."
 specie_famine.5.a:0 "Disaster averted, for now."
 specie_famine.6.t:0 "Specie Payments Resume"
 specie_famine.6.d:0 "Convertibility could not stay suspended forever. After 208 weeks of suspension, or 26 weeks of peace, the Bank must honour its notes in gold again. Buying back the specie will cost us every week for 12 months, and our foreign reserves are once more at the mercy of the [concept_balance_of_trade]."
 specie_famine.6.f:0 "A queue has formed outside the Bank, notes in hand."
 specie_famine.6.a:0 "Back to gold."

 ### Events: Inflationary Period
 inflationary_period.1.t:0 "An Inflationary Period"
 inflationary_period.1.d:0 "Our [concept_market] sells far more abroad than it buys, and the gold flowing in is swelling the money supply. Prices are climbing faster than wages, and the bankers are divided. Some say the boom should be left to run its course. Others would constrict the money supply and deleverage the economy before it overheats."
 inflationary_period.1.f:0 "“Too much money chasing too few goods,” wrote the economist, “is a fine problem to have, until it isn’t.”"
 inflationary_period.1.a:0 "Allow inflation."
 inflationary_period.1.b:0 "Constrict the money supply."
 inflationary_period.2.t:0 "Inflation in the Market"
 inflationary_period.2.d:0 "Gold is pouring into our [concept_market], and [GetPlayer.GetMarket.GetOwner.GetName] has chosen to let the boom run its course. For the next 24 months business will be brisk, but prices will outrun wages."
 inflationary_period.2.d_constricted:0 "Gold is pouring into our [concept_market], and [GetPlayer.GetMarket.GetOwner.GetName] has chosen to constrict the money supply. For the next 24 months foreign goods will be cheap and ours dear, and business will slow."
 inflationary_period.2.f:0 "The price of bread was posted twice this week."
 inflationary_period.2.a:0 "So be it."

 ### Events: Reserve Currency
 reserve_currency.1.t:0 "A New Reserve Currency"
 reserve_currency.1.d:0 "The world’s bankers now keep their reserves in the money of [GetGlobalVariable('reserve_currency_holder').GetCountry.GetName]. Its [concept_market] will enjoy better wages, and its credit will be the envy of the world."
 reserve_currency.1.d_gained:0 "The world’s bankers now keep their reserves in our money. Our [concept_market] will enjoy better wages, our credit will be the envy of the world, and our name will carry new weight. Rivals will try to take this from us."
 reserve_currency.1.d_lost:0 "Our money is no longer the world’s reserve. The bankers now keep their reserves in the money of [GetGlobalVariable('reserve_currency_holder').GetCountry.GetName], and the privileges of the [concept_reserve_currency] have gone with them."
 reserve_currency.1.f:0 "In the exchanges, the posted rates are now quoted in a new currency."
 reserve_currency.1.a:0 "Noted."
 reserve_currency.2.t:0 "No Reserve Currency"
 reserve_currency.2.d:0 "No country holds the [concept_reserve_currency]. The world’s bankers are keeping their reserves in gold until a new leader emerges: the Great Power with the most imports among those running a [concept_balance_of_trade] deficit, once it has led for 6 months in a row."
 reserve_currency.2.d_lost:0 "Our money is no longer the world’s reserve, and no country has taken our place. The bankers are keeping their reserves in gold until a new leader emerges."
 reserve_currency.2.f:0 "Gold, the bankers say, has never defaulted."
 reserve_currency.2.a:0 "Noted."
