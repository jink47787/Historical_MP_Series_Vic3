l_english:

 alert_low_leverage_alert_name: "Low Leverage Bloc Member"
 alert_low_leverage_alert_desc: "You or a bloc member has low (<50) leverage. AI nations will leave the bloc when leverage reaches 0, and some multiplayer rulesets require that players must also do this."
 alert_low_leverage_alert_hint: "A bloc leader can increase leverage generation through treaties, surplus diplomacy, some powerbloc mandates, bloc cohesion and economic dependence. A bloc member can also decrease their leverage resistance through laws related to trade, freedom of speech, economy and migration."
 alert_low_leverage_alert_action: "Power Bloc Panel"
 low_leverage_alert_setting_name: "Low Leverage"

 alert_gm_low_leverage_alert_name: "GM Low Leverage Bloc Member"
 alert_gm_low_leverage_alert_desc: "There is a player who has a non-subject bloc member with low (<20) leverage. AI nations will leave the bloc when leverage reaches 0, and some multiplayer rulesets require that players must also do this."
 alert_gm_low_leverage_alert_hint: "A bloc leader can increase leverage generation through treaties, surplus diplomacy, some powerbloc mandates, bloc cohesion and economic dependence. A bloc member can also decrease their leverage resistance through laws related to trade, freedom of speech, economy and migration."
 alert_gm_low_leverage_alert_action: "Power Bloc Panel"
 gm_low_leverage_alert_setting_name: "GM Low Leverage"

 alert_specie_famine_possible_alert_name: "Specie Famine Possible"
 alert_specie_famine_possible_alert_desc: "Our [concept_market] runs a [concept_balance_of_trade] deficit of at least #v 4%#! of [concept_gdp], so a [concept_specie_famine] can break out in any month. The greater the deficit, the more the risk."
 alert_specie_famine_possible_alert_hint: "Bring the deficit under #v 4%#! of [concept_gdp] to end the risk. The holder of the [concept_reserve_currency] is immune once it has researched #v Mutual Funds#!."
 alert_specie_famine_possible_alert_action: "Market Panel"
 specie_famine_possible_alert_setting_name: "Specie Famine Possible"

 alert_inflationary_period_possible_alert_name: "Inflationary Period Possible"
 alert_inflationary_period_possible_alert_desc: "Our [concept_market] runs a [concept_balance_of_trade] surplus of at least #v 4%#! of [concept_gdp], so an Inflationary Period can begin in any month. The greater the surplus, the more the risk."
 alert_inflationary_period_possible_alert_hint: "Bring the surplus under #v 4%#! of [concept_gdp] to end the risk."
 alert_inflationary_period_possible_alert_action: "Market Panel"
 inflationary_period_possible_alert_setting_name: "Inflationary Period Possible"

 alert_reserve_currency_gaining_alert_name: "Taking the Reserve Currency"
 alert_reserve_currency_gaining_alert_desc: "Our [concept_market] imports more than that of #v [GetGlobalVariable('reserve_currency_holder').GetCountry.GetName]#!. We will take the [concept_reserve_currency] in [GetVarTimeRemaining( GetPlayer.GetMarket.GetOwner.MakeScope, 'rc_takeover_days' )|v] day(s) unless the holder's imports recover.\n$HMPS_LONG_DELIMITER$\n$RC_TOP_IMPORTERS$"
 alert_reserve_currency_gaining_alert_hint: "Keep our [concept_market]'s imports above the holder's until the days run out."
 alert_reserve_currency_gaining_alert_action: "Market Panel"
 reserve_currency_gaining_alert_setting_name: "Taking the Reserve Currency"

 alert_reserve_currency_vacant_alert_name: "Taking the Reserve Currency"
 alert_reserve_currency_vacant_alert_desc: "No country holds the [concept_reserve_currency], and our [concept_market] imports the most. We will take it in [GetVarTimeRemaining( GetPlayer.GetMarket.GetOwner.MakeScope, 'rc_takeover_days' )|v] day(s) unless another [concept_market] overtakes ours.\n$HMPS_LONG_DELIMITER$\n$RC_TOP_IMPORTERS$"
 alert_reserve_currency_vacant_alert_hint: "Keep our [concept_market]'s imports the highest until the days run out."
 alert_reserve_currency_vacant_alert_action: "Market Panel"
 reserve_currency_vacant_alert_setting_name: "Taking the Vacant Reserve Currency"

 alert_reserve_currency_losing_alert_name: "Losing the Reserve Currency"
 alert_reserve_currency_losing_alert_desc: "The [concept_market] of #N [GetGlobalVariable('rc_top_challenger').GetCountry.GetName]#! imports more than ours. It will take the [concept_reserve_currency] from us in [GetVarTimeRemaining( GetGlobalVariable('rc_top_challenger').GetCountry.MakeScope, 'rc_takeover_days' )|v] day(s) unless our imports recover, and with it:\n$RC_TIER_EFFECTS$\n$HMPS_LONG_DELIMITER$\n$RC_TOP_IMPORTERS$"
 alert_reserve_currency_losing_alert_hint: "Raise our [concept_market]'s imports above the challenger's to stop the countdown."
 alert_reserve_currency_losing_alert_action: "Market Panel"
 reserve_currency_losing_alert_setting_name: "Losing the Reserve Currency"

 alert_reserve_currency_surplus_alert_name: "Losing the Reserve Currency"
 alert_reserve_currency_surplus_alert_desc: "Our [concept_market] no longer runs a [concept_balance_of_trade] deficit. We will lose the [concept_reserve_currency] in [GetVarTimeRemaining( GetPlayer.GetMarket.GetOwner.MakeScope, 'rc_surplus_days' )|v] day(s) unless the deficit returns, and with it:\n$RC_TIER_EFFECTS$"
 alert_reserve_currency_surplus_alert_hint: "Import more than our [concept_market] exports to stop the countdown."
 alert_reserve_currency_surplus_alert_action: "Market Panel"
 reserve_currency_surplus_alert_setting_name: "Losing the Reserve Currency (No Deficit)"
