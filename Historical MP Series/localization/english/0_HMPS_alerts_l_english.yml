l_english:

 alert_low_leverage_alert_name: "Low Leverage Bloc Member"
 alert_low_leverage_alert_desc: "You or a bloc member has low (<50) leverage. AI nations will leave the bloc when leverage reaches 0, and some multiplayer rulesets require that players must also do this."
 alert_low_leverage_alert_hint: "A bloc leader can increase leverage generation through treaties, surplus diplomacy, some powerbloc mandates, bloc cohesion and economic dependence. A bloc member can also decrease their leverage resistance through laws related to trade, freedom of speech, economy and migration."
 alert_low_leverage_alert_action: "Power Bloc Panel"
 low_leverage_alert_setting_name: "Low Leverage"

 alert_gm_low_leverage_alert_name: "GM Low Leverage Bloc Member"
 alert_gm_low_leverage_alert_desc: "There is a player who has a non-subject bloc member with low (<20) leverage. AI nations will leave the bloc when leverage reaches 0, and some multiplayer rulesets require that players must also do this."
 alert_gm_low_leverage_alert_hint: "A bloc leader can increase leverage generation through treaties, surplus diplomacy, some powerbloc mandates, bloc cohesion and economic dependence. A bloc member can also decrease their leverage resistance through laws related to trade, freedom of speech, economy and migration."
 alert_gm_low_leverage_alert_action: "Power Bloc Panel"
 gm_low_leverage_alert_setting_name: "GM Low Leverage"

 alert_specie_famine_possible_alert_name: "Specie Famine Possible"
 alert_specie_famine_possible_alert_desc: "Our [concept_market] runs a [concept_balance_of_trade] deficit of at least #v 4%#! of [concept_gdp], so a [concept_specie_famine] can break out in any month. The greater the deficit, the more the risk."
 alert_specie_famine_possible_alert_hint: "Bring the deficit under #v 4%#! of [concept_gdp] to end the risk. The holder of the [concept_reserve_currency] is immune once it has researched #v Mutual Funds#!."
 alert_specie_famine_possible_alert_action: "Market Panel"
 specie_famine_possible_alert_setting_name: "Specie Famine Possible"

 alert_inflationary_period_possible_alert_name: "Inflationary Period Possible"
 alert_inflationary_period_possible_alert_desc: "Our [concept_market] runs a [concept_balance_of_trade] surplus of at least #v 4%#! of [concept_gdp], so an Inflationary Period can begin in any month. The greater the surplus, the more the risk."
 alert_inflationary_period_possible_alert_hint: "Bring the surplus under #v 4%#! of [concept_gdp] to end the risk."
 alert_inflationary_period_possible_alert_action: "Market Panel"
 inflationary_period_possible_alert_setting_name: "Inflationary Period Possible"
