 je_acw_equality:0 "Equality for All"
 je_acw_equality_status:1 "Create a system that recognizes all men, from the North and South, and Black and White, as equals."
 je_acw_equality_reason:0 "This nation fought a war over deep issues that were papered over for generations until the problems became too big to ignore. We must avoid a repeat of this disaster, and tackle the problems head-on lest they are left to fester for another century."
 ACW_AFRO_AMERICAN_STATES_HEADER: "All of these [Concept('concept_state', '$concept_states$')] are [Concept('concept_incorporated_state','$concept_incorporated$')] and have at least [GetPlayer.MakeScope.ScriptValue('hmps_equality_afro_american_loyalists_min')|0v%] [GetCulture('afro_american').GetName] [Concept('concept_loyalist', '$concept_loyalists$')]:"
 ACW_AFRO_AMERICAN_STATES_LIST_ENTRY: "[THIS.GetState.GetName]: $concept_incorporated$: [SelectLocalization(THIS.GetState.IsIncorporated,'@green_checkmark_box!','@simple_box!')] $dixie$ $concept_loyalists$: [SelectLocalization(GreaterThanOrEqualTo_CFixedPoint(THIS.ScriptValue('afro_american_loyalist_fraction'), THIS.ScriptValue('acw_reincorporate_dixie_loyalist_min') ),'@green_checkmark_box!','@simple_box!')] ([THIS.ScriptValue('dixie_loyalist_fraction')|%+1])"
