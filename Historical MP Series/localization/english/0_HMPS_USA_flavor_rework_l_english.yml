 #Oregon Border Dispute
 hmps_start_oregon_settle_bc_button:0 "Begin Settling British Columbia"
 hmps_start_oregon_settle_bc_button_desc:0 "This will begin sending settlers to [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName] in the attempted to generate a [concept_claim] for the state."
