 #Oregon Border Dispute
 hmps_start_oregon_settle_bc_button:0 "Begin Settling British Columbia"
 hmps_start_oregon_settle_bc_button_desc:0 "This will begin sending settlers to [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName] in the attempted to generate a [concept_claim] for the state."
 hmps_settle_bc_tt:0 "Has Not Ended Settling [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName] in the Past #b 6#! Months"
 hmps_end_oregon_settle_bc_button:0 "End Settling British Columbia"
 hmps_end_oregon_settle_bc_button_desc:0 "The will end sending settlers to [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName]"
 hmps_end_settle_bc_tt:0 "Has Not Started Settling [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName] in the Past #b 6#! Months"
 hmps_survey_the_oregon_trail_button:0 "Survey the Oregon Trail"
 hmps_survey_the_oregon_trail_button_desc:0 ""
 hmps_send_demand_for_oregon_button:0 "The Oregon Treaty"
 hmps_send_demand_for_oregon_button_desc:0 "You will not be able to get [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName] if the #b Oregon Treaty#! is accepted."
 hmps_take_oregon_by_force_button:0 "Take the Oregon Territory by Force"
 hmps_take_oregon_by_force_button_desc:0 "When this decision is taken, the USA will immeditaly annex all claimed states in the #b Oregon Territory#! and a [concept_diplomatic_play] to defend our annexation and take the rest of the #b Oregon Territory#! will begin. [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName] will only be considered part of the #b Oregon Territory#! if it is being actively settled, or if a claim has already been generated against it."
 je_oregon_reason:0 "The proper location of the Oregon border has long been an undecided matter between Great Britain and the United States. It is high time that this dispute is settled.\n$HMPS_LONG_DELIMITER$\nBy default, the Oregon Trail will send #b 10#! pops to each state in the Oregon Territy a week until enough have been sent to generate a [concept_claim] on the state.\nThe weekly pops will be increased to #b 50#! by either #b Surveying the Oregon Trail#!, or by completing #yellow The Frontier Wars#! [concept_journal_entry].\nThe weekly pops sent will increase to #b 100#! by #b Surveying the Oregon Trail#! and completing the #yellow The Frontier Wars#! [concept_journal_entry].\n$HMPS_LONG_DELIMITER$\nTo generate a [concept_claim] on [GetStateRegion('STATE_WASHINGTON').GetName], the [GetCulture('yankee').GetName] #gold Cultural Percent#! must be at least #b 33%#!\nTo generate a [concept_claim] on [GetStateRegion('STATE_OREGON').GetName], the [GetCulture('yankee').GetName] #gold Cultural Percent#! must be at least #b 33%#!\nTo generate a [concept_claim] on [GetStateRegion('STATE_IDAHO').GetName], the [GetCulture('yankee').GetName] #gold Cultural Percent#! must be at least #b 20%#!\nTo generate a [concept_claim] on [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName], the [GetCulture('yankee').GetName] #gold Cultural Percent#! must be at least #b 20%#!"
 je_manifest_destiny_frontier_wars:0 "The Frontier Wars"
 hmps_oregon_border_dispute_war:0 "The Oregon Border Dispute"
 
 #Manifest Destiny Rework
 hmps_initiate_manifest_destiny:0 "Manifest Destiny"
 hmps_initiate_manifest_destiny_desc:0 ""
 hmps_send_demand_for_mexican_states:0 "Mexican Succession"
 hmps_send_demand_for_mexican_states_desc:0 "Sends a demand to [SCOPE.sCountry('hmps_mex_scope').GetName] to cede [GetStateRegion('STATE_CALIFORNIA').GetName], [GetStateRegion('STATE_NEVADA').GetName], [GetStateRegion('STATE_UTAH').GetName], [GetStateRegion('STATE_ARIZONA').GetName], [GetStateRegion('STATE_NEW_MEXICO').GetName], [GetStateRegion('STATE_COLORADO').GetName], and [GetStateRegion('STATE_TEXAS').GetName] to us. A war to forcefully take the states will begin if they do not accept our demand."
 je_manifest_destiny_mexico:0 "Manifest Destiny"
 manifest_destiny.4.t:0 "The United States Demand our States"
 manifest_destiny.4.d:0 "The United States has sent a demand for us the cede [GetStateRegion('STATE_CALIFORNIA').GetName], [GetStateRegion('STATE_NEVADA').GetName], [GetStateRegion('STATE_UTAH').GetName], [GetStateRegion('STATE_ARIZONA').GetName], [GetStateRegion('STATE_NEW_MEXICO').GetName], [GetStateRegion('STATE_COLORADO').GetName], and [GetStateRegion('STATE_TEXAS').GetName] to them under the threat of war."
 manifest_destiny.4.a:0 "Cede the States"
 manifest_destiny.a.b:0 "They Can Come and Take Them"
 hmps_manifest_destiny_time_limit_bar:0 "Months Until we Fail Manifest Destiny"
 hmps_manifest_destiny_time_limit_bar_desc:0 "[JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|0] Months Left"
 manifest_destiny_timer:0 "Manifest Destiny Timer"
 hmps_brd:0 "Has Disproven the Buenaventura River Theory"
