 hmps_send_demand_for_mexican_states_desc:0 "Sends a demand to [SCOPE.sCountry('hmps_mex_scope').GetName] to cede [GetStateRegion('STATE_CALIFORNIA').GetName], [GetStateRegion('STATE_NEVADA').GetName], [GetStateRegion('STATE_UTAH').GetName], [GetStateRegion('STATE_ARIZONA').GetName], [GetStateRegion('STATE_NEW_MEXICO').GetName], [GetStateRegion('STATE_COLORADO').GetName], and [GetStateRegion('STATE_TEXAS').GetName] to us. A war to forcefully take the states will begin if they do not accept our demand."
 je_manifest_destiny_mexico:0 "Manifest Destiny"
