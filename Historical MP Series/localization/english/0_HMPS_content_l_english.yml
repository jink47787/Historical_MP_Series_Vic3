 HMPS_FX_RESERVES_TT:0 "#header Reserves#!\nThe market's foreign-exchange and gold reserves, held by its owner and shared by every country in it. Measured in months of imports. Updated weekly.\n\nLast week:\nNet exports: @money![Country.MakeScope.Var('hmps_fx_net').GetValue|D+]\nGold mined: @money![Country.MakeScope.Var('hmps_fx_gold').GetValue|D+]\n[concept_hmps_fx_topup]: @money![Country.MakeScope.Var('hmps_fx_topup').GetValue|D+]\nMonthly import bill: @money![Country.MakeScope.Var('hmps_fx_import_bill').GetValue|D]\n\nTest version: reserves have no effects yet."
 HMPS_MARKET_FINANCE_HEADER:0 "Trade and Reserves"
 HMPS_FX_RATE:0 "[concept_hmps_fx_bank_rate]: [Country.MakeScope.Var('hmps_fx_rate').GetValue|0]%"
 HMPS_FX_RATE_TT:0 "#header Bank Rate#!\nSet by the market owner and followed by every country in the market. 4% is neutral and has no effects. The rate can change by one point a month.\n\nEach point above 4%: loan interest #N +1#! point, throughput #N -2%#!, [concept_building_wage] #N -2%#!, investment pool contribution #P +2#! points, export advantage #P +5%#!, import advantage #N -5%#!.\nEach point below 4%: loan interest #P -1#! point, investment pool contribution #N -2#! points, export advantage #N -5%#!, import advantage #P +5%#!.\nAll effects apply at once.\n\nThe loan interest points are added to the game's own interest rate, so the game's multipliers scale them too.\n\nTest version: the AI keeps 4% for now."
 HMPS_FX_RATE_SET_2_TT:0 "#header Bank Rate 2%#! [SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('hmps_fx_rate').GetValue, '(CFixedPoint)2'), 'HMPS_FX_RATE_CURRENT', 'HMPS_FX_RATE_NOT_CURRENT')]\nSet the [concept_hmps_fx_bank_rate] to 2%. It moves one point a month; 4% is neutral.\n\nEffects:\n#P -2%#! $country_loan_interest_rate_add$\n#N -4%#! $state_machinists_investment_pool_contribution_add$\n#N -4%#! $state_farmers_investment_pool_contribution_add$\n#N -4%#! $state_engineers_investment_pool_contribution_add$\n#N -4%#! $state_bureaucrats_investment_pool_contribution_add$\n#N -4%#! $state_shopkeepers_investment_pool_contribution_add$\n#N -4%#! $state_clergymen_investment_pool_contribution_add$\n#N -4%#! $state_aristocrats_investment_pool_contribution_add$\n#N -4%#! $state_capitalists_investment_pool_contribution_add$\n#N -10%#! $state_export_advantage_mult$\n#P +10%#! $state_import_advantage_mult$"
