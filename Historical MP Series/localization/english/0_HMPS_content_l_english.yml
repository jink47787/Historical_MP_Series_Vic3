 HMPS_FX_RATE_SET_4_TT:0 "#header Bank Rate 4%#! [SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('hmps_fx_rate').GetValue, '(CFixedPoint)4'), 'HMPS_FX_RATE_CURRENT', 'HMPS_FX_RATE_NOT_CURRENT')]\nSet the [concept_hmps_fx_bank_rate] to 4%. It moves one point a month; 4% is neutral.\n\nEffects:\nNone. 4% is the neutral rate."
