l_english:
  
 je_reform_indies_goal:0 "Improve GDP by 75%"
 je_sick_man_education_goal:0 "Increase the literacy rate of your people by 20%."
 wine_blight:0 "Wine Blight"
 wine_blight_evt.1.t:0 "Wine Blight"
 wine_blight_evt.1.d:0 "The Great Wine Blight was a severe blight of the mid-19th century that destroyed many of the vineyards in Western Europe and laid waste to the wine industry."
 wine_blight_evt.1.f:0 "It was caused by an aphid that originated in North America and was carried across the Atlantic in the late 1850s. The actual genus of the aphid is still debated, although it is largely considered to have been a species of Daktulosphaira vitifoliae, commonly known as grape phylloxera."
 wine_blight_evt.1.a:0 "We must find a solution!"
 wine_blight_evt.1.a.t:0 "Wheat farms and vineyards will experience a 75% reduction in wine output until the blight has ended."
 wine_blight_evt.2.t:0 "The Wine Blight Spreads"
 wine_blight_evt.2.d:0 "The Great Wine Blight was a severe blight of the mid-19th century that destroyed many of the vineyards in Western Europe and laid waste to the wine industry."
 wine_blight_evt.2.f:0 "It was caused by an aphid that originated in North America and was carried across the Atlantic in the late 1850s. The actual genus of the aphid is still debated, although it is largely considered to have been a species of Daktulosphaira vitifoliae, commonly known as grape phylloxera."
 wine_blight_evt.2.a:0 "It has now spread to us!"
 wine_blight_evt.3.t:0 "End of the Wine Blight"
 wine_blight_evt.3.a.t:0 "The Wine Blight modifier will be removed from every state in our nation."
 wine_blight_evt.3.d:0 "The endless blight has finally left our fields. Now we can finally quench our thirst!"
 wine_blight_evt.3.f:0 "Phylloxera devastated French vineyards in the 19th century. Various unsuccessful methods were tried, including chemicals and toads. Grafting resistant American vines with vulnerable European vines proved successful."
 wine_blight_evt.3.a:0 "Let's crack open a bottle!"
 building_military_shipyard:0 "Military Shipyard"
 pmg_ownership_capital_building_military_shipyard:1 "$pmg_ownership$"
 pm_merchant_guilds_building_military_shipyard:1 "$pm_merchant_guilds$"
 pm_privately_owned_building_military_shipyard:1 "$pm_privately_owned$"
 pm_publicly_traded_building_military_shipyard:1 "$pm_publicly_traded$"
 pm_government_run_building_military_shipyard:1 "$pm_government_run$"
 pm_worker_cooperative_building_military_shipyard:1 "$pm_worker_cooperative$"
 potato_blight.1.t:0 "The European Potato Failure Begins"
 potato_blight.1.d:0 "A mysterious sickness has infested the potato crops in [SCOPE.sState('potato_blight_origin').GetName] and is spreading to neighboring states. This could spell immense misery and disorder in the near future."
 potato_blight.1.f:0 "The European Potato Failure was a food crisis caused by potato blight that struck Northern and Western Europe in the mid-1840s. The time is also known as the Hungry Forties. While the crisis produced excess mortality and suffering across the affected areas, particularly affected were the Scottish Highlands and, even more harshly, Ireland. Many people starved due to lack of access to other staple food sources."
 potato_blight.1.a:0 "Surely the free market can handle this..."
 potato_blight.2.t:0 "The European Potato Failure"
 potato_blight.2.d:0 "A mysterious sickness infecting potato crops has begun in [SCOPE.sState('potato_blight_origin').GetName]. It appears to be rapidly spreading. This may spell immense misery and disorder in our country in the near future."
 potato_blight.2.f:0 "The blight will spread all throughout Europe until it exhausts itself."
 potato_blight.2.a:0 "Let us pray it avoids our farms and fields"
 potato_blight.3.t:0 "The Blight Arrives in our Country!"
 potato_blight.3.d:0 "The Potato Blight has finally spread to our lands, arriving in the state of [SCOPE.sState('potato_blight_origin_local').GetName]. We must do what we can to prevent this disaster from threatening our nation."
 potato_blight.4.t:0 "The Blight Stops Spreading!"
 potato_blight.4.d:0 "The Blight is no longer spreading throughout the land. Its current extent is the furthest it will grow."
 potato_blight.4.f:0 "The Blight will remain for an unknowable number of years until it begins to disappear on its own."
 potato_blight.4.a:0 "God help us!"
 potato_blight.5.t:0 "Irish Emigration"
 potato_blight.5.d:0 "Due to political discrimination, Irish emigration has increased alongside the arrival of the Potato Blight."
 potato_blight.5.f:0 "Surely they can simply pick themselves up by the bootstraps?"
 potato_blight.5.a:0 "Wait, come back!"
 potato_blight.5.a.t1:0 "Every Irish state that receives the blight will receive the following modifier"
 potato_blight.6.t:0 "The Blight is beginning to withdraw!"
 potato_blight.6.d:0 "Reports have begun to arrive in the capital that the blight finally appears to be receding. Hopefully soon it will disappear from our lands entirely."
 potato_blight.6.f:0 "The disease could not withstand our patience. We have outlasted it."
 potato_blight.6.a:0 "Let's look forward to good times ahead!"
 gutter_crown_war:0 "German War of Unification"
 railroad_bubble.3.t:0 "Railway Mania!"
 railroad_bubble.3.d:0 "The railroad industry has found that no matter how many are built, railways always are a good investment. The more invested into railroads, the higher the profits seem to become! No matter how many are built, they all seem to make money!"
 railroad_bubble.3.f:0 "The intense demand for railways present in the nation has led investors to become increasingly disconnected from the real value of railroads. Despite the risk, capitalists will continue to build railroads without end."
 railroad_bubble.3.a:0 "Current trends will continue indefinitely!"
 railroad_bubble.3.a.t:0 "Every railway will gain throughput, and every state will build faster. These effects will grow with the bubble."
 railroad_bubble.3.b:0 "Regulate the exchanges."
 railroad_bubble.3.b.t:0 "The boom and the eventual bust will both be #bold 25%#! weaker. Every railway will gain throughput, and every state will build faster, growing with the bubble."
 railroad_bubble.3.b.success_tt:0 "#bold The regulations work.#! Exchange regulators will cost bureaucracy until the bubble bursts."
 railroad_bubble.3.b.failure_tt:0 "#bold Speculators evade the regulations.#! The bubble runs at full strength, and the regulators still cost bureaucracy until it bursts."
 railroad_bubble.5.t:0 "The Bubble Peaks!"
 railroad_bubble.5.d:0 "The perceived value of railroads has risen and risen until it has reached its current peak. While nobody believes that the price could be higher, few expect it to fall either, and for a few more months the money will keep flowing."
 railroad_bubble.5.f:0 "The bubble will grow no further. How and when it bursts depends on how the government responds."
 railroad_bubble.5.a:0 "Nothing could possibly go wrong!"
 railroad_bubble.5.a.t:0 "The bubble keeps its modifiers for #bold six months#!, then bursts at #bold full#! strength."
 railroad_bubble.5.b:0 "Cool the market."
 railroad_bubble.5.b.t:0 "The bubble bursts #bold now#!, at #bold 75%#! strength."
 railroad_bubble.5.c:0 "Prop up the shares."
 railroad_bubble.5.c.t:0 "The bubble keeps its modifiers for #bold twelve months#!, then bursts at #bold 125%#! strength."
 railroad_bubble.5.e:0 "Let the banks carry it."
 railroad_bubble.6.t:0 "The Bubble Pops!"
 railroad_bubble.6.d:0 "Investors have collectively realized that the price of railroads is too high and have scrambled to readjust. Many fortunes tied into railroads have suddenly vanished into thin air." 
 railroad_bubble.6.f:0 "Due to the great sums of money invested in inefficient projects, there has been great money lost. It will take time for economic forces to re-align."
 railroad_bubble.6.a:0 "We can rebuild!"
 railroad_bubble.6.a.t:0 "All railways and states will lose their bubble modifiers."
 railroad_bubble.6.b:0 "Fund relief works."
 railroad_bubble.6.b.t:0 "Public works will raise dependents' wages by #bold 15%#! for the #bold twelve months#! the relief works run, making up part of what they lose in the crash."
 railroad_bubble.6.recovery_tt:0 "After #bold 12 months#! the crash eases into a recovery, and its penalties fade away over #bold 24 more months#!."
 railroad_bubble_fiscal_room_tt:0 "Our debt is below #bold half#! of our debt ceiling"
 railroad_bubble_legitimacy_tt:0 "Our government has at least #bold 75#! legitimacy"
 railroad_bubble_investment_pool_tt:0 "Our investment pool holds at least #bold 5%#! of our GDP"
 railroad_bubble.7.t:0 "The Railway King"
 railroad_bubble.7.d:0 "One financier has made himself master of half the nation's lines through a web of mergers, share issues and favours. Now he seeks charters for a dozen new routes, many of them through country no railway could ever profit from. Investors hang on his every word, and his dividends have never failed to impress."
 railroad_bubble.7.f:0 "Some whisper that those dividends are paid out of fresh capital rather than earnings. Nobody who holds his shares wants to ask."
 railroad_bubble.7.a:0 "Grant his charters."
 railroad_bubble.7.a.t:0 "The bubble grows by #bold 5#!."
 railroad_bubble.7.b:0 "Investigate his accounts."
 railroad_bubble.7.b.t:0 "The bubble shrinks by #bold 5#!."
 railroad_bubble.7.c:0 "This is no business of the state."
 pedro.7.a.t:0 "All African Heritage pops within Brazilian New World states will become Afro-Brazilian"
 je_caucasian_war_reason: "Our territorial ambitions in the Caucasus Mountains are being set back by fierce local resistance. We must crush all remaining resistance in order to secure our Southern border, and open the territories up for settlement.\n\nOnce the #bold Shell Gun#! and #bold Logistics#! technologies are researched, it will be possible to #bold escalate the war#!, and launch a full-scale invasion of the rebellious states."
 HMPS_BOT_BALANCE:0 "Market [concept_balance_of_trade]: @money![Country.MakeScope.Var('hmps_bot_balance').GetValue|D+] ([Country.MakeScope.Var('hmps_bot_share').GetValue|+%1] of [Concept('concept_gdp','$concept_gdp_short$')])"
 HMPS_BOT_TOTALS:0 "Exports: @money![Country.MakeScope.Var('hmps_bot_exports').GetValue|Dv]   Imports: @money![Country.MakeScope.Var('hmps_bot_imports').GetValue|Dv]   (Annualized)"
 HMPS_LEDGER_EXPORTS:0 "Exports"
 HMPS_LEDGER_EXPORTS_TT:0 "The market's exports, summed over every country in it and scaled so the world's balances sum to zero. Updated weekly."
 HMPS_LEDGER_IMPORTS:0 "Imports"
 HMPS_LEDGER_IMPORTS_TT:0 "The market's imports, summed over every country in it. Updated weekly."
 HMPS_LEDGER_NET_EXPORTS:0 "Net exports"
 HMPS_LEDGER_NET_EXPORTS_TT:0 "The market's exports minus imports: its [concept_balance_of_trade]. Updated weekly."
 HMPS_BOT_SURPLUS:0 "Trade surplus: adds to reserves, which can raise the [concept_hmps_fx_price_level]"
 HMPS_BOT_DEFICIT:0 "Trade deficit: drains reserves, which can lower the [concept_hmps_fx_price_level]"
 HMPS_BOT_BALANCED:0 "Trade is balanced"
 HMPS_FX_RESERVES:0 "#variable @money![Country.MakeScope.Var('hmps_fx_reserves').GetValue|D]#! ([Country.MakeScope.Var('hmps_fx_months').GetValue|1] months of imports)"
 HMPS_FX_RESERVES_TT:0 "#tooltip_header Foreign Exchange#!\nTotal: #v @money![Country.MakeScope.Var('hmps_fx_reserves').GetValue|D]#! ([Country.MakeScope.Var('hmps_fx_months').GetValue|1] months of imports)\nMonths of imports = reserves / [concept_hmps_fx_import_bill] (#v @money![Country.MakeScope.Var('hmps_fx_import_bill').GetValue|D]#!)\n$TOOLTIP_DELIMITER$\nForeign money and gold your market holds to pay for imports. Exports and mined gold add to it, and imports spend it. The market owner holds it for every country in the market. Updated weekly.\n\nTest version: reserves have no effects yet.\nRounding remainders given to the largest receiver last week, all should be about 0: flows @money![GetGlobalVariable('hmps_fx_left_flow').GetValue|D+], investment pools @money![GetGlobalVariable('hmps_fx_left_pool').GetValue|D+], interest @money![GetGlobalVariable('hmps_fx_left_interest').GetValue|D+]"
 HMPS_FX_CHANGE_HEADER:0 "Weekly Change"
 HMPS_FX_CHANGE_TT:0 "#tooltip_header Weekly Change#!\nTotal: #v @money![Country.MakeScope.Var('hmps_fx_change').GetValue|D+]#!\n$TOOLTIP_DELIMITER$\nWhat moved your reserves last week:\n#indent_newline:2   @money![Country.MakeScope.Var('hmps_fx_net').GetValue|D+] [concept_hmps_fx_net_exports]\n@money![Country.MakeScope.Var('hmps_fx_gold').GetValue|D+] [concept_hmps_fx_gold_mined]\n@money![Country.MakeScope.Var('hmps_fx_flow').GetValue|D+] [concept_hmps_fx_capital_flow]\n@money![Country.MakeScope.Var('hmps_fx_interest').GetValue|D+] [concept_hmps_fx_interest]\n@money![Country.MakeScope.Var('hmps_fx_commission').GetValue|D+] [concept_hmps_fx_commission]\n@money![Country.MakeScope.Var('hmps_fx_topup').GetValue|D+] [concept_hmps_fx_topup]#!"
 HMPS_FX_FOREIGN_TT:0 "#tooltip_header $concept_hmps_fx_foreign_held$#!\nTotal: #v @money![Negate(Country.MakeScope.Var('hmps_fx_foreign').GetValue)|D+]#!\n$TOOLTIP_DELIMITER$\n[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('hmps_fx_foreign').GetValue, '(CFixedPoint)0'), 'HMPS_FX_FOREIGN_OWED', 'HMPS_FX_FOREIGN_LENT')]\n\nLast week's [concept_hmps_fx_capital_flow] moved #v @money![Country.MakeScope.Var('hmps_fx_flow').GetValue|D+]#! into your market. Money that flows in adds to what foreigners hold here; money that flows out lowers it."
 HMPS_FX_FOREIGN_OWED:0 "Foreigners hold #v @money![Country.MakeScope.Var('hmps_fx_foreign').GetValue|D]#! in your market, shown as a minus because your market owes it. Your market pays them interest at your [concept_hmps_fx_bank_rate] of #v [Country.MakeScope.Var('hmps_fx_rate').GetValue|0]%#! a year: #v @money![Country.MakeScope.Var('hmps_fx_interest').GetValue|D+]#! last week."
 HMPS_FX_FOREIGN_LENT:0 "Your market has lent #v @money![Negate(Country.MakeScope.Var('hmps_fx_foreign').GetValue)|D]#! abroad. It earns a share of the interest that borrowing markets pay: #v @money![Country.MakeScope.Var('hmps_fx_interest').GetValue|D+]#! last week."
 HMPS_FX_POOL_MOVED_TT:0 "#tooltip_header $concept_hmps_fx_pool_moved$#!\nYour market: #v @money![Country.MakeScope.Var('hmps_fx_pool_moved').GetValue|D+]#!\nYour country: #v @money![GetPlayer.MakeScope.Var('hmps_fx_pool_share').GetValue|D+]#!\n$TOOLTIP_DELIMITER$\nLast week's [concept_hmps_fx_capital_flow]: #v @money![Country.MakeScope.Var('hmps_fx_flow').GetValue|D+]#!\n\nWhen money flows out of a market, half of the outflow is taken from its countries' investment pools, split by each country's share of the market's GDP. A country pays only if its pool can cover its whole share. Markets that money flows into receive what was paid, split by inflow, then by GDP share. This line doesn't change reserves."
 HMPS_FX_NET_TT:0 "#tooltip_header $concept_hmps_fx_net_exports$#!\nTotal: #v @money![Country.MakeScope.Var('hmps_fx_net').GetValue|D+]#!\n$TOOLTIP_DELIMITER$\nExports: #v @money![Country.MakeScope.Var('hmps_fx_exports').GetValue|D]#!\nImports: #v @money![Negate(Country.MakeScope.Var('hmps_fx_imports').GetValue)|D+]#!\n\nYour market's trade last week. Exports are scaled by #v [GetGlobalVariable('hmps_bot_world_ratio').GetValue|2]#!, the same ratio the Balance of Trade uses, so the world's net exports add up to zero."
 HMPS_FX_GOLD_TT:0 "#tooltip_header $concept_hmps_fx_gold_mined$#!\nTotal: #v @money![Country.MakeScope.Var('hmps_fx_gold').GetValue|D+]#!\n$TOOLTIP_DELIMITER$\nEvery unit of gold your market's gold mines and gold fields produced last week, at @money!100 per unit. Output counts how well they are staffed. Gold is accepted as money everywhere, so it adds straight to reserves."
 HMPS_FX_FLOW_TT:0 "#tooltip_header $concept_hmps_fx_capital_flow$#!\nTotal: #v @money![Country.MakeScope.Var('hmps_fx_flow').GetValue|D+]#!\n$TOOLTIP_DELIMITER$\nYour [concept_hmps_fx_bank_rate]: #v [Country.MakeScope.Var('hmps_fx_rate').GetValue|0]%#!\n[SelectLocalization(ObjectsEqual(Country.Self, GetGlobalVariable('hmps_fx_issuer').GetCountry.Self), 'HMPS_FX_FLOW_PULL', 'HMPS_FX_FLOW_NO_PULL')]World reference rate: #v [GetGlobalVariable('hmps_fx_ref_rate').GetValue|2]%#!\nMarket GDP: #v @money![Country.MakeScope.Var('hmps_fx_gdp').GetValue|D]#! a year\n\nWeekly flow = (rate + [concept_hmps_fx_safe_haven] - reference rate) x 1% of GDP / 52. Isolationist markets have no capital flow."
 HMPS_FX_FLOW_PULL:0 "[concept_hmps_fx_safe_haven]: #v +[Country.MakeScope.Var('hmps_fx_pull').GetValue|2]#! points\n"
 HMPS_FX_FLOW_NO_PULL:0 ""
 HMPS_FX_INTEREST_TT:0 "#tooltip_header $concept_hmps_fx_interest$#!\nTotal: #v @money![Country.MakeScope.Var('hmps_fx_interest').GetValue|D+]#!\n$TOOLTIP_DELIMITER$\n[SelectLocalization(GreaterThan_CFixedPoint(Country.MakeScope.Var('hmps_fx_foreign').GetValue, '(CFixedPoint)0'), 'HMPS_FX_INTEREST_PAID', 'HMPS_FX_INTEREST_EARNED')]"
 HMPS_FX_INTEREST_PAID:0 "[concept_hmps_fx_foreign_held]: #v @money![Country.MakeScope.Var('hmps_fx_foreign').GetValue|D]#!\nYour [concept_hmps_fx_bank_rate]: #v [Country.MakeScope.Var('hmps_fx_rate').GetValue|0]%#! a year\n\nWeekly interest = foreign money held x rate / 52, paid from your reserves to the markets that lent abroad."
 HMPS_FX_INTEREST_EARNED:0 "Lent abroad: #v @money![Negate(Country.MakeScope.Var('hmps_fx_foreign').GetValue)|D]#!\n\nMarkets that hold foreign money pay interest at their own [concept_hmps_fx_bank_rate]. Your market receives a share of that interest, in proportion to how much it has lent compared with all lending markets."
 HMPS_FX_COMMISSION_TT:0 "#tooltip_header $concept_hmps_fx_commission$#!\nTotal: #v @money![Country.MakeScope.Var('hmps_fx_commission').GetValue|D+]#!\n$TOOLTIP_DELIMITER$\n[SelectLocalization(ObjectsEqual(Country.Self, GetGlobalVariable('hmps_fx_issuer').GetCountry.Self), 'HMPS_FX_COMMISSION_EARNED', 'HMPS_FX_COMMISSION_PAID')]\n\nReserve currency: [GetGlobalVariable('hmps_fx_issuer').GetCountry.GetName]. While the role is passing to a new market, the old and new holders split the payments."
 HMPS_FX_COMMISSION_PAID:0 "Your market's total trade last week: #v @money![Country.MakeScope.Var('hmps_fx_trade').GetValue|D]#!\n\nYour market pays 0.5% of it to the reserve-currency market, for trade loans, insurance and banking."
 HMPS_FX_COMMISSION_EARNED:0 "Your market holds the reserve currency. Every other market pays it 0.5% of its total trade, for trade loans, insurance and banking."
 HMPS_FX_TOPUP_TT:0 "#tooltip_header $concept_hmps_fx_topup$#!\nTotal: #v @money![Country.MakeScope.Var('hmps_fx_topup').GetValue|D+]#!\n$TOOLTIP_DELIMITER$\nWorld reserves: #v [GetGlobalVariable('hmps_fx_world_months').GetValue|1]#! months of world imports, after any top-up\nYour [concept_hmps_fx_import_bill]: #v @money![Country.MakeScope.Var('hmps_fx_import_bill').GetValue|D]#!\n\nWhen world reserves fall below 12 months, every market gains (12 - world months) x its own monthly import bill."
 HMPS_FX_RESERVES_HEADER:0 "Foreign Exchange"
 HMPS_FX_REF_RATE:0 "Reference rate: [GetGlobalVariable('hmps_fx_ref_rate').GetValue|2]%"
 HMPS_FX_RATE_TT:0 "#header Bank Rate#!\nThe interest rate your market's central bank charges. Set by the market owner and followed by every country in the market. 4% is neutral and has no effects. It can move up to two points at a time, then stays locked for 30 days.\n\nEach point above 4%: loan interest #N +1#! point, throughput #N -2%#!, investment pool contribution #P +2#! points.\nEach point below 4%: loan interest #P -1#! point, throughput #P +2%#!, investment pool contribution #N -2#! points.\nAll effects apply at once.\n\nEach point your rate is above the world reference rate draws 1% of your market's GDP a year in as [concept_hmps_fx_capital_flow]; each point below sends 1% out. Isolationist markets have no capital flow.\n\nThe loan interest points are added to the game's own interest rate, so the game's multipliers scale them too.\n\nTest version: the AI keeps 4% for now.\nWorld reference rate: [GetGlobalVariable('hmps_fx_ref_rate').GetValue|2]%\nReserve currency: [GetGlobalVariable('hmps_fx_issuer').GetCountry.GetName]"
 HMPS_FX_RATE_SET_2_TT:0 "#header Bank Rate 2%#! [SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('hmps_fx_rate').GetValue, '(CFixedPoint)2'), 'HMPS_FX_RATE_CURRENT', 'HMPS_FX_RATE_NOT_CURRENT')]\nSet the [concept_hmps_fx_bank_rate] to 2%. It can move up to two points at a time, then stays locked for 30 days; 4% is neutral.\n\nEffects:\n#P -2%#! $country_loan_interest_rate_add$\n#P +4%#! $building_throughput_add$\n#N -4%#! $state_machinists_investment_pool_contribution_add$\n#N -4%#! $state_farmers_investment_pool_contribution_add$\n#N -4%#! $state_engineers_investment_pool_contribution_add$\n#N -4%#! $state_bureaucrats_investment_pool_contribution_add$\n#N -4%#! $state_shopkeepers_investment_pool_contribution_add$\n#N -4%#! $state_clergymen_investment_pool_contribution_add$\n#N -4%#! $state_aristocrats_investment_pool_contribution_add$\n#N -4%#! $state_capitalists_investment_pool_contribution_add$\n\nEstimated [concept_hmps_fx_capital_flow]: [Country.MakeScope.ScriptValue('hmps_fx_flow_at_2')|D+] a year, from last week's world reference rate."
 HMPS_FX_RATE_SET_3_TT:0 "#header Bank Rate 3%#! [SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('hmps_fx_rate').GetValue, '(CFixedPoint)3'), 'HMPS_FX_RATE_CURRENT', 'HMPS_FX_RATE_NOT_CURRENT')]\nSet the [concept_hmps_fx_bank_rate] to 3%. It can move up to two points at a time, then stays locked for 30 days; 4% is neutral.\n\nEffects:\n#P -1%#! $country_loan_interest_rate_add$\n#P +2%#! $building_throughput_add$\n#N -2%#! $state_machinists_investment_pool_contribution_add$\n#N -2%#! $state_farmers_investment_pool_contribution_add$\n#N -2%#! $state_engineers_investment_pool_contribution_add$\n#N -2%#! $state_bureaucrats_investment_pool_contribution_add$\n#N -2%#! $state_shopkeepers_investment_pool_contribution_add$\n#N -2%#! $state_clergymen_investment_pool_contribution_add$\n#N -2%#! $state_aristocrats_investment_pool_contribution_add$\n#N -2%#! $state_capitalists_investment_pool_contribution_add$\n\nEstimated [concept_hmps_fx_capital_flow]: [Country.MakeScope.ScriptValue('hmps_fx_flow_at_3')|D+] a year, from last week's world reference rate."
 HMPS_FX_RATE_SET_4_TT:0 "#header Bank Rate 4%#! [SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('hmps_fx_rate').GetValue, '(CFixedPoint)4'), 'HMPS_FX_RATE_CURRENT', 'HMPS_FX_RATE_NOT_CURRENT')]\nSet the [concept_hmps_fx_bank_rate] to 4%. It can move up to two points at a time, then stays locked for 30 days; 4% is neutral.\n\nEffects:\nNone. 4% is the neutral rate.\n\nEstimated [concept_hmps_fx_capital_flow]: [Country.MakeScope.ScriptValue('hmps_fx_flow_at_4')|D+] a year, from last week's world reference rate."
 HMPS_FX_RATE_SET_5_TT:0 "#header Bank Rate 5%#! [SelectLocalization(EqualTo_CFixedPoint(Country.MakeScope.Var('hmps_fx_rate').GetValue, '(CFixedPoint)5'), 'HMPS_FX_RATE_CURRENT', 'HMPS_FX_RATE_NOT_CURRENT')]\nSet the [concept_hmps_fx_bank_rate] to 5%. It can move up to two points at a time, then stays locked for 30 days; 4% is neutral.\n\nEffects:\n#N +1%#! $country_loan_interest_rate_add$\n#N -2%#! $building_throughput_add$\n#P +2%#! $state_machinists_investment_pool_contribution_add$\n#P +2%#! $state_farmers_investment_pool_contribution_add$\n#P +2%#! $state_engineers_investment_pool_contribution_add$\n#P +2%#! $state_bureaucrats_investment_pool_contribution_add$\n#P +2%#! $state_shopkeepers_investment_pool_contribution_add$\n#P +2%#! $state_clergymen_investment_pool_contribution_add$\n#P +2%#! $state_aristocrats_investment_pool_contribution_add$\n#P +2%#! $state_capitalists_investment_pool_contribution_add$\n\nEstimated [concept_hmps_fx_capital_flow]: [Country.MakeScope.ScriptValue('hmps_fx_flow_at_5')|D+] a year, from last week's world reference rate."
