 HMPS_FX_PRICE_TT:0 "#tooltip_header Price Level: $HMPS_FX_PRICE_LEVEL$#!\nHeading for #v [Country.MakeScope.Var('hmps_fx_price_target').GetValue|+1]#!. The level moves one step once this target has stayed at least one step away for 26 weeks (#v [Country.MakeScope.Var('hmps_fx_price_weeks').GetValue|0]#! so far).\n$TOOLTIP_DELIMITER$\nMoney: #v [Country.MakeScope.Var('hmps_fx_price_money').GetValue|+1]#! (your reserves, compared with your GDP, are #v [Country.MakeScope.Var('hmps_fx_price_ratio').GetValue|2]x#! the world's)\n[concept_hmps_fx_bank_rate]: #v [Country.MakeScope.Var('hmps_fx_price_rate').GetValue|+1]#! (4% is neutral)\n$TOOLTIP_DELIMITER$\nEach step of inflation: wages #v -2%#!, throughput #v +2%#!, export advantage #v -5%#!, import advantage #v +5%#!. Deflation is the reverse."
 HMPS_BOT_TOOLTIP:0 "#header [concept_balance_of_trade]#!\nExports: @money![Country.MakeScope.Var('hmps_bot_exports').GetValue|Dv] (@money![Country.MakeScope.Var('hmps_bot_exports_weekly').GetValue|Dv] per week)\nImports: @money![Country.MakeScope.Var('hmps_bot_imports').GetValue|Dv] (@money![Country.MakeScope.Var('hmps_bot_imports_weekly').GetValue|Dv] per week)\nMarket [concept_gdp]: @money![Country.MakeScope.Var('hmps_bot_gdp').GetValue|D]\nAll values are summed over every country in the market and annualized (weekly values x 52).\nExports are scaled x[GetGlobalVariable('hmps_bot_world_ratio').GetValue|2] so world exports equal world imports; the weekly figure is before scaling.\n\n$HMPS_BOT_RULE$"
 HMPS_BOT_RULE:0 "[concept_balance_of_trade] is the value of a [concept_market]'s exports minus its imports, summed over every country in the [concept_market] and measured as a share of their combined [concept_gdp]. It has no direct effect. Net exports add to the market's foreign exchange reserves, and reserves above or below the world average move the [concept_hmps_fx_price_level], which pulls trade back toward balance.\n\nUpdated weekly."
