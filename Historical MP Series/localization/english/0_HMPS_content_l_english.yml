 HMPS_BOT_TOOLTIP:0 "#header [concept_balance_of_trade]#!\nExports: @money![Country.MakeScope.Var('hmps_bot_exports').GetValue|Dv] (@money![Country.MakeScope.Var('hmps_bot_exports_weekly').GetValue|Dv] per week)\nImports: @money![Country.MakeScope.Var('hmps_bot_imports').GetValue|Dv] (@money![Country.MakeScope.Var('hmps_bot_imports_weekly').GetValue|Dv] per week)\nMarket [concept_gdp]: @money![Country.MakeScope.Var('hmps_bot_gdp').GetValue|D]\nAll values are summed over every country in the market and annualized (weekly values x 52).\n\n$HMPS_BOT_RULE$"
 HMPS_BOT_RULE:0 "[concept_balance_of_trade] is the value of a [concept_market]'s exports minus its imports, summed over every country in the [concept_market] and measured as a share of their combined [concept_gdp]. Every country in the [concept_market] gets the same effect. Markets that trade far more one way than the other find foreign markets turning against them.\n\nWhen the balance is more than #v 1%#! of [concept_gdp] either way, the side that is ahead loses #v 5%#! [concept_trade_advantage] for every #v 1%#! of [concept_gdp], up to #N -50%#! at #v 10%#!. The other side gains #v 2.5%#! for every #v 1%#! of [concept_gdp], up to #P +25%#!.\n- A surplus lowers export advantage and raises import advantage.\n- A deficit lowers import advantage and raises export advantage.\n\nUpdated weekly."
