 #Economic Centralization Law Group
 political_economy:0 "Political Economy"
 political_economy_desc:0 "The study of how production, trade, and the laws of the state shape the wealth of nations. Whether the economy is best left to the market or directed by the state is now a question of national policy."

 #Synth Oil
 synfuel:0 "Synfuel"
 synfuel_desc:0 "Synthetic fuel or synfuel is a liquid fuel, or sometimes gaseous fuel, obtained from syngas, a mixture of carbon monoxide and hydrogen, in which the syngas was derived from gasification of solid feedstocks such as coal or biomass or by reforming of natural gas."
 
 #Scout Cruiser Tech
 scout_cruiser:0 "Scout Cruiser"
 scout_cruiser_desc:0 "Scout cruisers are fast, lightly armed and armored warship developed as an upgrade from destroyers, offering greater size and firepower for fleet scouting and flotilla leadership roles."
 
