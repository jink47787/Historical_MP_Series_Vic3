l_english:
 je_oregon_reason:0 "The proper location of the Oregon border has long been an undecided matter between Great Britain and the United States. It is high time that this dispute is settled.\n$HMPS_LONG_DELIMITER$\nBy default, the Oregon Trail will send #b 10#! pops to each state in the Oregon Territory each week until enough have been sent to generate a [concept_claim] on the state.\nThe weekly pops will be increased to #b 50#! by either #b Surveying the Oregon Trail#!, or by completing #yellow The Frontier Wars#! [concept_journal_entry].\nThe weekly pops sent will increase to #b 100#! by #b Surveying the Oregon Trail#! and completing #yellow The Frontier Wars#! [concept_journal_entry].\n$HMPS_LONG_DELIMITER$\nTo generate a [concept_claim] on [GetStateRegion('STATE_WASHINGTON').GetName], the [GetCulture('yankee').GetName] #gold Cultural Percent#! must be at least #b 25%#!\nTo generate a [concept_claim] on [GetStateRegion('STATE_OREGON').GetName], the [GetCulture('yankee').GetName] #gold Cultural Percent#! must be at least #b 25%#!\nTo generate a [concept_claim] on [GetStateRegion('STATE_IDAHO').GetName], the [GetCulture('yankee').GetName] #gold Cultural Percent#! must be at least #b 15%#!\nTo generate a [concept_claim] on [GetStateRegion('STATE_BRITISH_COLUMBIA').GetName], the [GetCulture('yankee').GetName] #gold Cultural Percent#! must be at least #b 15%#!"
 je_manifest_destiny_frontier_wars:0 "The Frontier Wars"
 je_manifest_destiny_mexico:0 "Manifest Destiny"
